spring:
  application:
    name: quiz-hub

  datasource:
    url: jdbc:postgresql://localhost:5432/quiz_hub
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: 6a2f8e1c4b7d9f3a5e2b8c1d4f7a9e3c6b2f8e1c4b7d9f3a5e2b8c1d4f7a9e3c
    expiration: 86400000   # 24 hours in milliseconds

server:
  error:
    include-message: always