<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân | QuizHub</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/toast.css}">

    <style>
        :root {
            --blue:       #2563eb;
            --green:      #28a745;
            --red:        #dc3545;
            --text-dark:  #1a1a2e;
            --text-body:  #4a5568;
            --text-muted: #718096;
            --bg-body:    #eef2f7;
            --border:     #e2e8f0;
            --shadow:     0 2px 20px rgba(0,0,0,0.07);
            --radius:     20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1,h2,h3,h4,h5,h6 {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 800;
            color: var(--text-dark);
        }

        a { text-decoration: none; }

        /* ─── TOP BAR ─── */
        .topbar {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow);
        }

        .topbar-brand {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .topbar-brand i {
            font-size: 22px;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s;
        }

        /* Logo gradient theo role */
        .brand-icon-admin   { background: linear-gradient(135deg, #a855f7, #7c3aed) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }
        .brand-icon-teacher { background: linear-gradient(135deg, #4ade80, #16a34a) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }
        .brand-icon-student { background: linear-gradient(135deg, #60a5fa, #2563eb) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }

        .topbar-brand .hub {
            background: linear-gradient(90deg, #3b82f6, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            color: var(--text-body);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #f1f5f9;
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ─── PAGE CONTENT ─── */
        .page-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 24px;
            gap: 28px;
            flex-wrap: wrap;
        }

        /* ─── AVATAR CARD ─── */
        .avatar-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 40px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
            flex-shrink: 0;
        }

        .avatar-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            font-weight: 800;
            font-family: 'Nunito Sans', sans-serif;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 8px 24px rgba(37,99,235,0.25);
            margin-bottom: 18px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-align: center;
            font-family: 'Nunito Sans', sans-serif;
        }

        .avatar-email {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-align: center;
        }

        .role-badge {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .role-admin   { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
        .role-teacher { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .role-student { background: linear-gradient(135deg, #64748b, #475569); }

        .avatar-stat {
            display: none;
        }

        .avatar-stat .stat-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .avatar-stat .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        /* ─── FORM CARD ─── */
        .form-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 36px 40px;
            flex: 1;
            min-width: 320px;
            max-width: 580px;
        }

        .form-card-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .form-card-header h4 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .form-card-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        /* ─── FORM FIELDS ─── */
        .field-group {
            margin-bottom: 22px;
        }

        .field-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-group label .badge-readonly {
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            margin-left: 6px;
        }

        .field-wrap {
            position: relative;
        }

        .field-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .field-wrap input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: #f8fafc;
            transition: all 0.25s;
            outline: none;
        }

        .field-wrap input:focus {
            border-color: var(--blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
        }

        .field-wrap input::placeholder {
            color: #b0bec5;
        }

        .field-wrap input:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            background: #f1f5f9;
        }

        /* ─── AVATAR UPLOAD AREA ─── */
        .avatar-upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .btn-upload-file {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            background: #f1f5f9;
            border: 1.5px dashed var(--border);
            border-radius: 10px;
            color: var(--text-body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-upload-file:hover {
            background: #e0f2fe;
            border-color: var(--blue);
            color: var(--blue);
        }

        .upload-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        #upload-progress {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--blue);
            font-weight: 600;
            margin-top: 6px;
        }

        /* ─── SUBMIT BUTTON ─── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,0.3); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ─── PASSWORD SECTION ─── */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
        }

        .section-divider span {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }


    </style>
</head>
<body>

<!-- ─── TOP BAR ─── -->
<nav class="topbar">
    <a id="topbar-brand-link" href="/" class="topbar-brand" style="text-decoration: none;">
        <i id="brand-icon" class="bi bi-layers-fill"></i><span>Quiz<span class="hub">Hub</span></span>
    </a>
    <button class="btn-back" onclick="goBack()">
        <i class="bi bi-arrow-left"></i> Quay lại Dashboard
    </button>
</nav>

<!-- ─── PAGE CONTENT ─── -->
<div class="page-content">

    <!-- AVATAR CARD -->
    <div class="avatar-card">
        <div class="avatar-wrap" id="avatar-container">
            <i class="bi bi-person" style="font-size:40px; color:rgba(255,255,255,0.6)"></i>
        </div>
        <div class="avatar-name" id="disp-name">Đang tải...</div>
        <div class="avatar-email" id="disp-email"></div>
        <span class="role-badge" id="role-badge" style="visibility:hidden"></span>
    </div>

    <!-- FORM CARD -->
    <div class="form-card">
        <div class="form-card-header">
            <h4><i class="bi bi-person-gear me-2" style="color:var(--blue)"></i>Hồ sơ cá nhân</h4>
            <p>Cập nhật thông tin tài khoản của bạn</p>
        </div>

        <form id="profile-form" onsubmit="updateProfile(event)">
            <!-- Họ tên -->
            <div class="field-group">
                <label>Họ và Tên</label>
                <div class="field-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" id="fullName" placeholder="Nhập họ và tên..." required>
                </div>
            </div>

            <!-- Email -->
            <div class="field-group">
                <label>Email <span class="badge-readonly">Không thể thay đổi</span></label>
                <div class="field-wrap">
                    <i class="bi bi-envelope" style="color:#d1d5db"></i>
                    <input type="email" id="email" disabled>
                </div>
            </div>

            <!-- Điện thoại -->
            <div class="field-group">
                <label>Số điện thoại</label>
                <div class="field-wrap">
                    <i class="bi bi-telephone"></i>
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại...">
                </div>
            </div>

            <!-- Avatar URL + Upload file -->
            <div class="field-group">
                <label>Ảnh đại diện</label>
                <div class="d-flex gap-2 mb-2">
                    <button type="button" id="avatarTabUpload" onclick="switchAvatarTab('upload')" class="btn btn-sm btn-primary" style="border-radius:8px; font-size:12px;">
                        <i class="bi bi-cloud-upload me-1"></i>Tải ảnh lên
                    </button>
                    <button type="button" id="avatarTabUrl" onclick="switchAvatarTab('url')" class="btn btn-sm btn-outline-secondary" style="border-radius:8px; font-size:12px;">
                        <i class="bi bi-link-45deg me-1"></i>Nhập URL
                    </button>
                </div>
                <input type="hidden" id="avatarUrl">
                
                <div id="avatarPanelUpload">
                    <p class="upload-hint" style="margin-top: 0;">Định dạng hỗ trợ: JPEG, PNG, WebP (Tối đa 5MB)</p>
                    <div class="avatar-upload-row">
                        <label class="btn-upload-file" for="avatarFileInput">
                            <i class="bi bi-cloud-upload"></i> Tải ảnh từ máy
                        </label>
                        <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarFileUpload(this)">
                        <span id="upload-file-name" style="font-size:13px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;"></span>
                    </div>
                    <div id="upload-progress">
                        <span class="spinner-border spinner-border-sm"></span> Đang tải lên...
                    </div>
                </div>

                <div id="avatarPanelUrl" style="display:none;">
                    <div class="field-wrap">
                        <i class="bi bi-link-45deg"></i>
                        <input type="text" id="avatarUrlInput" placeholder="https://example.com/avatar.jpg" oninput="syncAvatarUrl(this.value)">
                    </div>
                    <div id="avatarUrlPreviewBox" class="mt-2" style="display:none;">
                        <img id="avatarUrlPreview" src="" alt="Preview" style="max-height:80px; border-radius:8px; object-fit:cover; border:1px solid #e2e8f0;">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <i class="bi bi-check2-circle"></i> Lưu thay đổi
            </button>
        </form>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
<script>
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    if (!token) window.location.replace('/login');

    let userRole = null;

    async function loadProfile() {
        try {
            const res = await fetch('/api/users/my-profile', {
                headers: { Authorization: `Bearer ${token}` }
            });

            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login');
                return;
            }

            if (!res.ok) throw new Error('Lỗi tải thông tin');

            const d = await res.json();

            document.getElementById('fullName').value  = d.fullName  || '';
            document.getElementById('email').value     = d.email     || '';
            document.getElementById('phone').value     = d.phone     || '';
            document.getElementById('avatarUrl').value = d.avatarUrl || '';

            document.getElementById('disp-name').textContent  = d.fullName || '—';
            document.getElementById('disp-email').textContent = d.email    || '—';

            userRole = d.role;
            const badge = document.getElementById('role-badge');
            if (d.role === 'ADMIN') {
                badge.textContent = 'Administrator';
                badge.className = 'role-badge role-admin';
            } else if (d.role === 'TEACHER') {
                badge.textContent = 'Giáo viên';
                badge.className = 'role-badge role-teacher';
            } else {
                badge.textContent = 'Học sinh';
                badge.className = 'role-badge role-student';
            }
            badge.style.visibility = 'visible';

            // Cập nhật logo + link topbar theo role
            updateBrandForRole(d.role);

            renderAvatar(d.avatarUrl, d.fullName);
        } catch (e) {
            showToast(e.message || 'Có lỗi xảy ra', 'error');
        }
    }

    async function updateProfile(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang lưu...';
        btn.disabled = true;

        try {
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const avatarUrl = document.getElementById('avatarUrl').value.trim();

            const urlTabActive = document.getElementById('avatarPanelUrl').style.display !== 'none';
            const urlInputValue = document.getElementById('avatarUrlInput').value.trim();
            if (urlTabActive && urlInputValue && !avatarUrl) {
                showToast('URL ảnh không hợp lệ hoặc chưa tải xong!', 'error');
                btn.innerHTML = '<i class="bi bi-check2-circle"></i> Lưu thay đổi';
                btn.disabled  = false;
                return;
            }

            const res = await fetch('/api/users/my-profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                    fullName:  fullName,
                    phone:     phone,
                    avatarUrl: avatarUrl
                })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'Cập nhật thất bại');
            }

            const d = await res.json();

            // Cập nhật sidebar display
            document.getElementById('disp-name').textContent  = d.fullName || '—';
            renderAvatar(d.avatarUrl, d.fullName);

            // Cập nhật localStorage
            const sess = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || '{}');
            sess.fullName  = d.fullName;
            sess.avatarUrl = d.avatarUrl;
            localStorage.setItem('user', JSON.stringify(sess));

            showToast('Hồ sơ đã được lưu thành công!', 'success');
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            btn.innerHTML = '<i class="bi bi-check2-circle"></i> Lưu thay đổi';
            btn.disabled  = false;
        }
    }

    function renderAvatar(url, name) {
        const el = document.getElementById('avatar-container');
        if (url) {
            el.innerHTML = `<img src="${url}" alt="Avatar" onerror="fallbackAvatar('${name}')">`;
        } else {
            fallbackAvatar(name);
        }
    }

    function fallbackAvatar(name) {
        const el = document.getElementById('avatar-container');
        const role = userRole || (JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || '{}').role);
        let bgColor = '10b981'; // default student green
        if (role === 'ADMIN') {
            bgColor = 'dc3545';
        } else if (role === 'TEACHER') {
            bgColor = '28a745';
        }
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&background=${bgColor}&color=fff`;
        el.innerHTML = `<img src="${avatarUrl}" alt="Avatar">`;
    }

    async function handleAvatarFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        // Client-side validation
        if (!file.type.startsWith('image/')) {
            showToast('Chỉ chấp nhận file ảnh (JPEG, PNG, GIF, WebP)!', 'error');
            input.value = '';
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            showToast('File ảnh không được vượt quá 5MB!', 'error');
            input.value = '';
            return;
        }

        // Hiển thị tên file + spinner
        document.getElementById('upload-file-name').textContent = file.name;
        const progressEl = document.getElementById('upload-progress');
        progressEl.style.display = 'flex';

        try {
            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/users/upload-avatar', {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || 'Tải ảnh thất bại');
            }

            // Điền URL vào input và cập nhật preview
            const urlInput = document.getElementById('avatarUrl');
            urlInput.value = data.url;
            renderAvatar(data.url, document.getElementById('fullName').value);
            showToast('Tải ảnh lên thành công!', 'success');
        } catch (err) {
            showToast(err.message || 'Có lỗi khi tải ảnh lên', 'error');
            document.getElementById('upload-file-name').textContent = '';
            input.value = '';
        } finally {
            progressEl.style.display = 'none';
        }
    }

    function updateAvatarPreview() {
        renderAvatar(
            document.getElementById('avatarUrl').value.trim(),
            document.getElementById('fullName').value.trim()
        );
    }

    function updateBrandForRole(role) {
        const icon = document.getElementById('brand-icon');
        const link = document.getElementById('topbar-brand-link');
        if (!icon || !link) return;

        if (role === 'ADMIN') {
            icon.className = 'bi bi-shield-fill-check brand-icon-admin';
            link.href = '/admin';
        } else if (role === 'TEACHER') {
            icon.className = 'bi bi-mortarboard-fill brand-icon-teacher';
            link.href = '/teacher';
        } else {
            icon.className = 'bi bi-layers-fill brand-icon-student';
            link.href = '/student';
        }
    }

    function goBack() {
        const role = userRole || (JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || '{}').role);
        if (role === 'ADMIN')        window.location.href = '/admin';
        else if (role === 'TEACHER') window.location.href = '/teacher';
        else                         window.location.href = '/student';
    }

    function switchAvatarTab(tab) {
        const isUpload = tab === 'upload';
        document.getElementById('avatarPanelUpload').style.display = isUpload ? '' : 'none';
        document.getElementById('avatarPanelUrl').style.display = isUpload ? 'none' : '';
        document.getElementById('avatarTabUpload').className = 'btn btn-sm ' + (isUpload ? 'btn-primary' : 'btn-outline-secondary');
        document.getElementById('avatarTabUrl').className = 'btn btn-sm ' + (!isUpload ? 'btn-primary' : 'btn-outline-secondary');
        
        document.getElementById('avatarUrl').value = '';
        if (isUpload) {
            document.getElementById('upload-file-name').textContent = '';
        } else {
            document.getElementById('avatarUrlInput').value = '';
            document.getElementById('avatarUrlPreviewBox').style.display = 'none';
        }
    }

    function syncAvatarUrl(val) {
        document.getElementById('avatarUrl').value = '';
        const box = document.getElementById('avatarUrlPreviewBox');
        const img = document.getElementById('avatarUrlPreview');
        const urlInput = document.getElementById('avatarUrlInput');
        urlInput.classList.remove('is-valid', 'is-invalid');
        if (val.trim()) {
            box.style.display = '';
            img.onload = () => {
                document.getElementById('avatarUrl').value = val.trim();
                urlInput.classList.remove('is-invalid');
                urlInput.classList.add('is-valid');
                renderAvatar(val.trim(), document.getElementById('fullName').value);
            };
            img.onerror = () => {
                box.style.display = 'none';
                urlInput.classList.remove('is-valid');
                urlInput.classList.add('is-invalid');
            };
            img.src = val.trim();
        } else { box.style.display = 'none'; }
    }

    function showToast(msg, type = "success") {
        if (type === "error" || type === "err") toast.error(msg);
        else if (type === "warning" || type === "warn") toast.warning(msg);
        else toast.success(msg);
    }

    loadProfile();
</script>
</body>
</html>
