<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả bài thi | QuizHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        html {
            zoom: 85%;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 50px;
        }



        .summary-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 8px solid #dcfce7;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-dark);
            line-height: 1;
        }

        .score-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .stat-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 15px;
            flex: 1;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #334155;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
        }

        .review-title {
            margin-top: 50px;
            margin-bottom: 25px;
            font-weight: 800;
            color: #334155;
        }

        .q-result-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }

        .q-result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .q-badge, .q-level-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #e2e8f0;
        }

        .badge-correct { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .badge-wrong { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .badge-warning { background: #fef9c3; color: #854d0e; border-color: #fef08a; }
        
        .q-level-badge.level-easy { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
        .q-level-badge.level-medium { background: #fffbeb; color: #d97706; border-color: #fde68a; }
        .q-level-badge.level-hard { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

        .ans-opt {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1.5px solid #f1f5f9;
        }

        .ans-opt.correct {
            background: #f0fdf4;
            border-color: #22c55e;
            box-shadow: 0 0 0 1px #22c55e;
        }

        .ans-opt.selected-wrong {
            background: #fff1f2;
            border-color: #ef4444;
            box-shadow: 0 0 0 1px #ef4444;
        }

        .opt-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        .icon-correct { background: #4ade80; color: white; }
        .icon-wrong { background: #fb7185; color: white; }
        .icon-none { background: #e2e8f0; color: #94a3b8; }



        #resultLoading {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body th:data-attempt-id="${attemptId}">

    <div id="resultLoading">
        <div class="loader-spinner mb-3"></div>
        <p class="fw-bold text-muted">Đang tải kết quả bài thi...</p>
    </div>

    <header th:replace="~{layout/header :: student-header(activePage='history')}"></header>

    <div class="container" style="margin-top: 110px; margin-bottom: 50px;">
        <!-- Summary Section -->
        <div class="summary-card">
            <div class="score-circle">
                <span class="score-value" id="scoreValue">0.0</span>
                <span class="score-label">Điểm</span>
            </div>
            <h2 class="fw-bold mb-4" id="quizTitle">Tên bài thi</h2>
            
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <div class="stat-box">
                    <div class="stat-value text-success" id="correctCount">0</div>
                    <div class="stat-label">Câu đúng</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value text-danger" id="incorrectCount">0</div>
                    <div class="stat-label">Câu sai</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="timeSpent">0 ph</div>
                    <div class="stat-label">Thời gian làm bài</div>
                </div>
            </div>
        </div>

        <!-- Review Section -->
        <h4 class="review-title">Xem lại chi tiết</h4>
        <div id="questionsReviewList">
            <!-- Questions rendered here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/student/quiz-result.js}"></script>
</body>
</html>
