<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư Viện Học Tập | QuizHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/student/student-categories-mine.css}">
</head>

<body>
    <header th:replace="~{layout/header :: student-header(activePage='myqbank')}"></header>

    <div class="explorer-container page-fade-in">
        <!-- Sidebar -->
        <aside class="explorer-sidebar">
            <div class="sidebar-header">
                <div class="position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="treeSearch" class="form-control ps-5" style="border-radius:14px; border:1px solid #e2e8f0; padding:12px;" placeholder="Tìm thư mục..." oninput="handleSearchTree()">
                </div>
            </div>
            <div class="tree-panel" id="treeRoot">
                <div class="skeleton-tree-item">
                    <div class="skeleton skeleton-tree-icon"></div>
                    <div class="skeleton skeleton-tree-text"></div>
                </div>
                <div class="skeleton-tree-item">
                    <div class="skeleton skeleton-tree-icon"></div>
                    <div class="skeleton skeleton-tree-text" style="width: 40%;"></div>
                </div>
                <div class="skeleton-tree-item">
                    <div class="skeleton skeleton-tree-icon"></div>
                    <div class="skeleton skeleton-tree-text" style="width: 60%;"></div>
                </div>
            </div>

            <div class="tree-footer mt-auto p-4 border-top bg-white">
                <div id="unassignedNodeWrapper" class="mb-3">
                    <div class="tree-node" onclick="loadFolder(-1)" id="folder--1" style="display: flex; align-items: center; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; color: #475569; font-weight: 500;">
                        <i class="bi bi-folder-x me-2 text-warning" style="font-size: 1.2rem;"></i>
                        <span style="font-size: 0.95rem;">Chưa phân loại</span>
                    </div>
                </div>
                <button class="btn btn-light w-100 rounded-4 fw-bold p-3 text-muted" style="border: 2px dashed #e2e8f0; transition: 0.2s;" onclick="openCreateModal(null)">
                    <i class="bi bi-folder-plus me-2"></i> Thêm thư mục gốc
                </button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="explorer-content">
            <div class="content-header">
                <div>
                    <div class="path-breadcrumb" id="pathText">
                        <span>LIBRARY</span>
                        <i class="bi bi-chevron-right" style="font-size: 0.6rem;"></i>
                        <span class="text-indigo">DASHBOARD</span>
                    </div>
                    <h1 class="folder-title" id="currentName">Thư viện của tôi</h1>
                    <div class="d-flex gap-3 mt-3">
                        <div class="folder-stat-pill"><i class="bi bi-layers-fill"></i> <span id="statQuizCount">0</span> Đề thi</div>
                        <div class="folder-stat-pill"><i class="bi bi-question-circle-fill"></i> <span id="statQuestionCount">0</span> Câu hỏi</div>
                    </div>
                </div>
                    <div class="header-actions">
                        <div class="d-flex gap-2">
                            <button class="btn-icon-sm" id="btnEditCat" style="display:none;" onclick="openEditModal()"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn-icon-sm text-danger" id="btnDeleteCat" style="display:none;" onclick="deleteFolder()"><i class="bi bi-trash3-fill"></i></button>
                            <div id="mainActionBtn">
                                <a href="/student/quiz/create" id="btnCreateQuiz" class="btn-premium">
                                    <i class="bi bi-plus-lg"></i> Tạo đề thi
                                </a>
                            </div>
                        </div>
                        <div class="context-toggle">
                            <button class="tab-btn active" id="tab-quiz" onclick="switchContext('quiz')">
                                <i class="bi bi-journal-text me-1"></i> Đề thi
                            </button>
                            <button class="tab-btn" id="tab-question" onclick="switchContext('question')">
                                <i class="bi bi-patch-question me-1"></i> Câu hỏi
                            </button>
                        </div>
                    </div>
            </div>

            <div id="contentList" class="mt-2">
                <div class="quiz-grid">
                    <div class="skeleton-item">
                        <div class="skeleton skeleton-banner"></div>
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                    </div>
                    <div class="skeleton-item">
                        <div class="skeleton skeleton-banner"></div>
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text" style="width: 50%;"></div>
                    </div>
                    <div class="skeleton-item">
                        <div class="skeleton skeleton-banner"></div>
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text" style="width: 80%;"></div>
                    </div>
                    <div class="skeleton-item">
                        <div class="skeleton skeleton-banner"></div>
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text" style="width: 60%;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Fragments -->
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-create-modal}"></div>
    <div th:replace="~{fragments/question-editor :: question-editor-modal}"></div>
    <div th:replace="~{fragments/quiz-preview :: quiz-preview-modal}"></div>
    <th:block th:replace="~{fragments/category-explorer-private :: category-explorer-private-scripts(userType='student')}"></th:block>

    <!-- Delete Category Confirm Modal -->
    <div class="modal fade" id="delCatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4" style="border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div style="font-size:3rem; margin-bottom:15px;">🗑️</div>
                <h5 class="fw-bold mb-2">Xóa danh mục?</h5>
                <p class="text-muted small mb-4">Các danh mục con sẽ được tách ra và đề thi bên trong sẽ không bị xóa.</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-light w-50 fw-bold" data-bs-dismiss="modal" style="border-radius:12px; padding: 10px;">Hủy</button>
                    <button class="btn btn-danger w-50 fw-bold" onclick="confirmDelCat()" style="border-radius:12px; padding: 10px; background: #ef4444;">Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/student/student-categories-mine.js}"></script>
    <th:block th:replace="~{fragments/question-editor :: question-editor-scripts(userType='student')}"></th:block>

</body>

</html>
