<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizHub | Ngân hàng đề thi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">

    <style>
        /* ══════════════════════════════════════════════
           EXPLORE LAYOUT (Public Bank)
        ══════════════════════════════════════════════ */
        .explore-shell {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.05);
            min-height: calc(100vh - 120px);
            padding: 30px 40px;
            border: 1px solid #e2e8f0;
        }

        /* ── Header Area ── */
        .explore-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .explore-title {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .explore-subtitle {
            color: #64748b;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Breadcrumb Navigation ── */
        .explore-breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 25px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .bc-item {
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bc-item:hover { color: #4f46e5; }
        .bc-item.active {
            color: #1e1b4b;
            cursor: default;
        }
        
        .bc-sep { color: #cbd5e1; font-size: 0.8rem; position: relative; padding: 0 4px; }
        .bc-sep-hoverable:hover i { color: #4f46e5; }
        .bc-dropdown { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 6px; z-index: 100; min-width: 180px; display: none; font-weight: normal; text-align: left; }
        .bc-dropdown::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: #fff; border-left: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; }
        .bc-dropdown.show { display: block; animation: dropDownFade 0.2s ease; }
        @keyframes dropDownFade { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .bc-dropdown-item { padding: 8px 12px; font-size: 0.85rem; font-weight: 600; color: #475569; border-radius: 8px; cursor: pointer; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .bc-dropdown-item:hover { background: #f1f5f9; color: #4f46e5; }
        .bc-dropdown-item.active { background: #e0e7ff; color: #4f46e5; }

        /* ── Grid Areas ── */
        .section-title {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: #1e1b4b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ── Category Cards ── */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .cat-card {
            border-radius: 20px;
            padding: 24px 20px;
            background: #fff;
            border: 1px solid #e2e8f0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .cat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--bg1, #4f46e5), var(--bg2, #7c3aed));
            opacity: 0.8;
            transition: height 0.3s;
        }
        .cat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border-color: transparent;
        }
        .cat-card:hover::before { height: 10px; }
        .cat-icon-wrap {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: #475569;
            transition: all 0.3s;
        }
        .cat-card:hover .cat-icon-wrap {
            background: var(--bg1, #4f46e5);
            color: #fff;
            transform: scale(1.1);
        }
        .cat-name { font-weight: 800; font-size: 1.1rem; color: #1e1b4b; line-height: 1.3; }
        .cat-meta { font-size: 0.8rem; color: #94a3b8; font-weight: 600; background: #f8fafc; padding: 4px 10px; border-radius: 20px; }

        /* ── Quiz Cards ── */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .quiz-card {
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            background: #fff;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .quiz-card::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(180deg, #10b981, #059669);
            opacity: 0; transition: opacity 0.2s;
        }
        .quiz-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.07); border-color: #a7f3d0; transform: translateY(-3px); }
        .quiz-card:hover::after { opacity: 1; }

        .quiz-badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .qbadge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; }
        .qbadge-exam { background: #fef3c7; color: #d97706; }
        .qbadge-quiz { background: #dbeafe; color: #1d4ed8; }

        .quiz-title { font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 1.15rem; color: #1e1b4b; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .quiz-desc { font-size: 0.9rem; color: #64748b; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .quiz-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .chip { font-size: 0.8rem; font-weight: 600; background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; color: #64748b; }

        .btn-start { width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s; margin-top: auto; }
        .btn-start:hover { opacity: 0.9; box-shadow: 0 8px 20px rgba(16,185,129,0.3); transform: translateY(-1px); }

        /* ── Empty states ── */
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 15px; display: block; }
        .empty-state h3 { font-family: 'Nunito Sans', sans-serif; font-weight: 800; color: #475569; margin-bottom: 10px; }

        .skeleton-cat { height: 160px; border-radius: 20px; }
        .skeleton-quiz { height: 240px; border-radius: 16px; }
        .skeleton { animation: shimmer 1.5s infinite; background: linear-gradient(90deg,#f4f4f4 25%,#eaeaea 50%,#f4f4f4 75%); background-size:200% 100%; }
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

        /* Toast */
        #toastWrap { position:fixed; top:22px; right:22px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
        .toast-msg { background:#1e1b4b; color:#fff; border-radius:14px; padding:12px 18px; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:9px; box-shadow:0 8px 24px rgba(0,0,0,0.18); opacity:0; transform:translateX(16px); transition:all 0.3s ease; pointer-events:none; }
        .toast-msg.show { opacity:1; transform:translateX(0); }
        .toast-msg.ok i { color:#4ade80; }
        .toast-msg.err i { color:#fb7185; }
    </style>
</head>

<body>

<header th:replace="~{layout/header :: student-header(activePage='qbank')}"></header>

<main class="container" style="padding-top: 100px; padding-bottom: 50px;">
    <div class="explore-shell">
        <div class="explore-header" id="exploreHeader">
            <h1 class="explore-title">Khám Phá Ngân Hàng Đề Thi</h1>
            <p class="explore-subtitle">Hàng ngàn bài kiểm tra và câu đố đa dạng từ cộng đồng giáo viên và học sinh đang chờ bạn chinh phục.</p>
        </div>

        <div class="explore-breadcrumb" id="breadcrumb" style="display:none;">
            <!-- Breadcrumb injected here -->
        </div>

        <div id="exploreContent">
            <!-- Loading Skeletons -->
            <div class="cat-grid">
                <div class="skeleton skeleton-cat"></div>
                <div class="skeleton skeleton-cat"></div>
                <div class="skeleton skeleton-cat"></div>
                <div class="skeleton skeleton-cat"></div>
            </div>
        </div>
    </div>
</main>

<div id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
<script>
const CAT_API = '/api/student/categories/public';
const QUIZ_API = '/api/student/categories/{id}/quizzes/public';

let TREE_DATA = [];
let navStack = [];

// Palette for random category colors
const COLOR_PALETTE = [
    { bg1: '#4f46e5', bg2: '#7c3aed', icon: 'bi-globe' },
    { bg1: '#ea580c', bg2: '#f97316', icon: 'bi-lightbulb' },
    { bg1: '#059669', bg2: '#10b981', icon: 'bi-book' },
    { bg1: '#be123c', bg2: '#e11d48', icon: 'bi-compass' },
    { bg1: '#0284c7', bg2: '#0ea5e9', icon: 'bi-rocket' },
    { bg1: '#65a30d', bg2: '#84cc16', icon: 'bi-award' },
    { bg1: '#7c3aed', bg2: '#a855f7', icon: 'bi-puzzle' },
    { bg1: '#b45309', bg2: '#d97706', icon: 'bi-star' }
];

document.addEventListener('DOMContentLoaded', () => {
    loadRoot();
    document.addEventListener('click', () => {
        document.querySelectorAll('.bc-dropdown').forEach(d => d.classList.remove('show'));
    });
});

async function loadRoot() {
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    try {
        const res = await fetch(CAT_API, { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) throw new Error('Lỗi tải danh mục');
        TREE_DATA = await res.json();

        if (navStack.length === 0) {
            renderRoot();
        } else {
            // Restore state if needed (not strictly necessary for public explore view, but good practice)
            const currentId = navStack[navStack.length-1].id;
            loadCategory(currentId);
        }
    } catch (e) {
        document.getElementById('exploreContent').innerHTML = `<div class="empty-state"><i class="bi bi-wifi-off"></i><h3>${e.message}</h3></div>`;
    }
}

function renderRoot() {
    const content = document.getElementById('exploreContent');
    const bc = document.getElementById('breadcrumb');
    const header = document.getElementById('exploreHeader');

    bc.style.display = 'none';
    header.style.display = 'block';

    if (!TREE_DATA || TREE_DATA.length === 0) {
        content.innerHTML = `<div class="empty-state"><i class="bi bi-folder-x"></i><h3>Chưa có danh mục nào</h3><p>Hệ thống hiện chưa có đề thi công khai.</p></div>`;
        return;
    }

    let html = `<h2 class="section-title"><i class="bi bi-grid-fill text-primary"></i> Chủ Đề Nổi Bật</h2>`;
    html += `<div class="cat-grid">`;
    TREE_DATA.forEach((cat, idx) => {
        const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
        const total = calcTotal(cat);
        html += `<div class="cat-card" style="--bg1:${color.bg1}; --bg2:${color.bg2};" onclick="navigateTo(${cat.id}, '${escJs(cat.name)}')">
            <div class="cat-icon-wrap"><i class="bi ${color.icon}"></i></div>
            <div class="cat-name">${esc(cat.name)}</div>
            <div class="cat-meta">${total} tài liệu</div>
        </div>`;
    });
    html += `</div>`;
    content.innerHTML = html;
}

function getPathToNode(nodes, targetId, currentPath = []) {
    for (const n of nodes) {
        const path = [...currentPath, { id: n.id, name: n.name }];
        if (n.id === targetId) return path;
        if (n.children) {
            const found = getPathToNode(n.children, targetId, path);
            if (found) return found;
        }
    }
    return null;
}

function findNode(nodes, id) {
    for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) { const f = findNode(n.children, id); if (f) return f; }
    }
    return null;
}

function calcTotal(node) {
    let t = node.quizCount || 0;
    if (node.children) node.children.forEach(c => t += calcTotal(c));
    return t;
}

function navigateToRoot() {
    navStack = [];
    renderRoot();
}

function navigateTo(id, name) {
    const path = getPathToNode(TREE_DATA, id);
    if (path) {
        navStack = path;
    } else {
        navStack = [{ id, name }];
    }
    loadCategory(id);
}

function navigateFromBreadcrumb(idx) {
    if (idx < 0) { navigateToRoot(); return; }
    const item = navStack[idx];
    navigateTo(item.id, item.name);
}

function renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    let html = `<span class="bc-item" onclick="navigateToRoot()"><i class="bi bi-house-door-fill" style="font-size:1.1rem;"></i> Trang chủ</span>`;
    navStack.forEach((item, i) => {
        const parentId = i > 0 ? navStack[i-1].id : null;
        const siblings = getChildrenOf(parentId);
        
        let siblingHtml = '';
        let hasSiblings = siblings && siblings.length > 1;
        if (hasSiblings) {
            siblingHtml = `<div class="bc-dropdown" onclick="event.stopPropagation()">
                ${siblings.map(s => `<div class="bc-dropdown-item ${s.id === item.id ? 'active' : ''}" onclick="navigateTo(${s.id}, '${escJs(s.name)}')">${esc(s.name)}</div>`).join('')}
            </div>`;
        }
        
        html += `<span class="bc-sep ${hasSiblings ? 'bc-sep-hoverable' : ''}" ${hasSiblings ? 'style="cursor:pointer;" onclick="toggleBcDropdown(event, this)"' : ''}>
            <i class="bi bi-chevron-right"></i>
            ${siblingHtml}
        </span>`;
        
        if (i < navStack.length - 1) {
            html += `<span class="bc-item" onclick="navigateFromBreadcrumb(${i})">${esc(item.name)}</span>`;
        } else {
            html += `<span class="bc-item active">${esc(item.name)}</span>`;
        }
    });
    bc.innerHTML = html;
    bc.style.display = 'flex';
    document.getElementById('exploreHeader').style.display = 'none';
}

function getChildrenOf(parentId) {
    if (!parentId) return TREE_DATA;
    const parent = findNode(TREE_DATA, parentId);
    return parent ? parent.children : [];
}

function toggleBcDropdown(e, el) {
    e.stopPropagation();
    document.querySelectorAll('.bc-dropdown').forEach(d => {
        if (d !== el.querySelector('.bc-dropdown')) d.classList.remove('show');
    });
    const dropdown = el.querySelector('.bc-dropdown');
    if (dropdown) dropdown.classList.toggle('show');
}

async function loadCategory(id) {
    renderBreadcrumb();
    const content = document.getElementById('exploreContent');
    content.innerHTML = `
        <div class="cat-grid">${[1,2].map(()=>`<div class="skeleton skeleton-cat"></div>`).join('')}</div>
        <div class="quiz-grid">${[1,2,3].map(()=>`<div class="skeleton skeleton-quiz"></div>`).join('')}</div>
    `;

    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    const node = findNode(TREE_DATA, id);
    const subCats = node ? (node.children || []) : [];

    let quizzes = [];
    try {
        const res = await fetch(QUIZ_API.replace('{id}', id), { headers: { Authorization: 'Bearer ' + token } });
        if (res.ok) quizzes = await res.json();
    } catch (_) {}

    let html = '';

    if (subCats.length > 0) {
        html += `<h2 class="section-title"><i class="bi bi-folder2-open text-primary"></i> Thư mục con</h2>`;
        html += `<div class="cat-grid">`;
        subCats.forEach((cat, idx) => {
            const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
            const total = calcTotal(cat);
            html += `<div class="cat-card" style="--bg1:${color.bg1}; --bg2:${color.bg2};" onclick="navigateTo(${cat.id}, '${escJs(cat.name)}')">
                <div class="cat-icon-wrap"><i class="bi bi-folder-fill"></i></div>
                <div class="cat-name">${esc(cat.name)}</div>
                <div class="cat-meta">${total} tài liệu</div>
            </div>`;
        });
        html += `</div>`;
    }

    if (quizzes.length > 0) {
        html += `<h2 class="section-title"><i class="bi bi-journal-text text-success"></i> Đề thi & Quiz</h2>`;
        html += `<div class="quiz-grid">`;
        quizzes.forEach(q => {
            const typeBadge = q.isExam ? `<span class="qbadge qbadge-exam"><i class="bi bi-mortarboard-fill"></i> Đề thi</span>` : `<span class="qbadge qbadge-quiz"><i class="bi bi-journal-check"></i> Quiz</span>`;

            html += `<div class="quiz-card">
                <div class="quiz-badge-row">${typeBadge}</div>
                <h3 class="quiz-title">${esc(q.title) || '(Chưa có tiêu đề)'}</h3>
                <p class="quiz-desc">${esc(q.description) || '<span style="color:#cbd5e1;font-style:italic;">Không có mô tả.</span>'}</p>
                <div class="quiz-chips">
                    <span class="chip"><i class="bi bi-list-check text-success"></i> ${q.questionCount} câu</span>
                    ${q.creatorName ? `<span class="chip"><i class="bi bi-person text-primary"></i> ${esc(q.creatorName)}</span>` : ''}
                </div>
                <button class="btn-start" onclick="startAttempt('${q.id}', '${escJs(q.title)}', this)">
                    <i class="bi bi-play-fill"></i> Bắt đầu Luyện Tập
                </button>
            </div>`;
        });
        html += `</div>`;
    }

    if (subCats.length === 0 && quizzes.length === 0) {
        html = `<div class="empty-state">
            <i class="bi bi-box-seam"></i>
            <h3>Thư mục trống</h3>
            <p>Hiện chưa có nội dung nào trong danh mục này.</p>
        </div>`;
    }

    content.innerHTML = html;
}

async function startAttempt(quizId, title, btn) {
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang nạp...';
    try {
        const res = await fetch('/api/student/attempts/start', {
            method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ quizId })
        });
        if (!res.ok) throw new Error('Không thể bắt đầu làm bài. Hãy thử lại.');
        const data = await res.json();
        showToast(`🎯 Bắt đầu: "${title}"`, 'ok');
        if (data.attemptId) setTimeout(() => window.location.href = `/student/attempts/${data.attemptId}`, 800);
        else { btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Đã tạo!'; btn.style.background = '#10b981'; }
    } catch (e) { showToast(e.message, 'err'); btn.disabled = false; btn.innerHTML = orig; }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escJs(s) { return s ? s.replace(/'/g, "\\'").replace(/"/g, '\\"') : ''; }

function showToast(msg, type = 'ok') {
    const w = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = `toast-msg ${type}`;
    t.innerHTML = `<i class="bi ${type === 'ok' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'}"></i> ${msg}`;
    w.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}
</script>
</body>
</html>
