<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub | Phòng thi trực tuyến</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        :root {
            --exam-primary: #1e1b4b;
            --exam-accent: #4f46e5;
            --exam-bg: #f1f5f9;
            --card-bg: #ffffff;
            --timer-bg: #fee2e2;
            --timer-text: #ef4444;
        }

        body {
            background-color: var(--exam-bg);
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* ── Synchronized Header ── */
        .exam-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #ffffff;
            color: #1e293b;
            z-index: 1000;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 40px;
            border-bottom: 2px solid #f1f5f9;
            box-shadow: 0 2px 15px rgba(0,0,0,0.02);
        }

        .exam-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #1a1a2e;
            font-family: 'Nunito Sans', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            font-size: 26px;
            margin-right: 8px;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .hub {
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .exam-timer-wrapper {
            display: flex;
            justify-content: center;
        }

        .exam-timer-box {
            background: #f8fafc;
            padding: 8px 30px;
            border-radius: 100px;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Nunito Sans', sans-serif;
            transition: all 0.3s ease;
        }
        
        .timer-warning {
            background: #fee2e2 !important;
            border-color: #fecaca !important;
            color: #ef4444 !important;
            animation: timerPulse 1.5s infinite;
        }

        @keyframes timerPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .timer-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #334155;
        }
        
        .timer-warning .timer-text {
            color: #ef4444;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }

        .btn-exit-exam {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-exit-exam:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .user-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 20px;
            border-left: 1px solid #e2e8f0;
        }

        .user-mini img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #10b981;
        }

        /* ── View Mode Toggle ── */
        .view-mode-card {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .toggle-container {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
        }

        .toggle-btn-mode {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .toggle-btn-mode.active {
            background: #fff;
            color: #10b981;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* ── Full Mode Styles ── */
        .full-mode-question {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            scroll-margin-top: 100px;
        }

        #examTitle {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
            margin: 0;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Layout ── */
        .exam-container {
            margin-top: 110px;
            margin-bottom: 50px;
        }

        /* ── Sidebar ── */
        .exam-sidebar {
            background: white;
            border-radius: 20px;
            padding: 25px;
            position: sticky;
            top: 110px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }

        .q-dot {
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #e2e8f0;
            background: #fff;
            color: #64748b;
        }

        .q-dot.active {
            border-color: var(--exam-accent);
            color: var(--exam-accent);
            background: #eef2ff;
        }

        .q-dot.answered {
            background: var(--exam-accent);
            color: white;
            border-color: var(--exam-accent);
        }

        /* ── Question Card ── */
        .question-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            min-height: 450px;
            position: relative;
        }

        .q-meta {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .q-type-badge {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* ── Answers ── */
        .answer-opt {
            padding: 18px 25px;
            border-radius: 16px;
            border: 2px solid #f1f5f9;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .answer-opt:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .answer-opt.selected {
            border-color: var(--exam-accent);
            background: #eef2ff;
        }

        .opt-prefix {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #64748b;
        }

        .answer-opt.selected .opt-prefix {
            background: var(--exam-accent);
            color: white;
        }

        /* ── Footer ── */
        .exam-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn-nav {
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-submit:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        /* ── Loader ── */
        #pageLoading {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f1f5f9;
            border-top: 5px solid var(--exam-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body th:data-assigning-id="${quizId}">

    <div id="pageLoading">
        <div class="loader-spinner mb-3"></div>
        <p class="fw-bold text-muted">Đang thiết lập phòng thi...</p>
    </div>

    <header class="exam-header">
        <!-- Left: Logo & Title -->
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/student}" class="exam-logo">
                <i class="bi bi-layers-fill logo-icon"></i>
                Quiz<span class="hub">Hub</span>
            </a>
            <div style="width: 1px; height: 20px; background: #e2e8f0; margin: 0 5px;"></div>
            <h5 id="examTitle">Đang tải...</h5>
        </div>

        <!-- Center: Timer -->
        <div class="exam-timer-wrapper">
            <div class="exam-timer-box" id="timerBox">
                <i class="bi bi-clock-fill fs-5 text-primary"></i>
                <span class="timer-text" id="timerDisplay">--:--</span>
            </div>
        </div>

        <!-- Right: Actions & User -->
        <div class="header-actions">
            <button class="btn-exit-exam" onclick="confirmExit()">
                <i class="bi bi-door-open me-1"></i>Thoát
            </button>
            <div class="user-mini d-none d-md-flex">
                <span class="fw-bold small" th:text="${currentUser != null ? currentUser.fullName : 'Học Sinh'}">Học Sinh</span>
                <img th:src="${currentUser != null && currentUser.avatarUrl != null && !currentUser.avatarUrl.isEmpty() ? currentUser.avatarUrl : 'https://ui-avatars.com/api/?name=' + (currentUser != null ? currentUser.fullName : 'Student') + '&background=10b981&color=fff'}" alt="Avatar">
            </div>
        </div>
    </header>

    <div class="container exam-container">
        <div class="row g-4">
            <!-- Left: Main Content -->
            <div class="col-lg-8">
                <!-- Single Mode Container -->
                <div id="singleModeView">
                    <div class="question-card" id="questionCard">
                        <div class="q-meta">
                            <span class="q-type-badge" id="qNumber">Câu 1</span>
                            <span class="q-type-badge" id="qType">Trắc nghiệm</span>
                        </div>

                        <div class="q-text" id="qText">
                            Đang chuẩn bị câu hỏi...
                        </div>

                        <div id="answersList">
                            <!-- Answers -->
                        </div>

                        <div class="exam-footer">
                            <button class="btn btn-outline-secondary btn-nav" id="btnPrev" onclick="prevQuestion()">
                                <i class="bi bi-chevron-left"></i> Câu trước
                            </button>
                            <button class="btn btn-primary btn-nav" id="btnNext" onclick="nextQuestion()">
                                Câu tiếp theo <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Full Mode Container (Hidden by default) -->
                <div id="fullModeView" style="display: none;">
                    <!-- List of questions will be rendered here -->
                </div>
            </div>

            <!-- Right: Sidebar -->
            <div class="col-lg-4">
                <div class="exam-sidebar">
                    <!-- View Mode Toggle -->
                    <div class="view-mode-card">
                        <p class="small fw-bold text-muted mb-2">Chế độ hiển thị</p>
                        <div class="toggle-container">
                            <button class="toggle-btn-mode active" id="btnSingleMode" onclick="setViewMode('single')">
                                <i class="bi bi-square me-1"></i> Từng câu
                            </button>
                            <button class="toggle-btn-mode" id="btnFullMode" onclick="setViewMode('full')">
                                <i class="bi bi-list-ul me-1"></i> Toàn bộ
                            </button>
                        </div>
                    </div>

                    <h6 class="fw-bold mb-3 d-flex justify-content-between">
                        <span>Tiến trình</span>
                        <span id="progressText">0/0</span>
                    </h6>
                    <div class="q-grid mb-4" id="qGrid">
                        <!-- Dots -->
                    </div>

                    <hr>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-2 small fw-bold">
                            <span>Đã trả lời</span>
                            <span id="answeredCount">0</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar bg-success" id="progressBar" style="width: 0%"></div>
                        </div>
                    </div>

                    <button class="btn btn-submit w-100" onclick="submitQuiz()">
                        <i class="bi bi-send-fill me-2"></i> NỘP BÀI THI
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="submitModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-body p-4 text-center">
                    <div class="mb-3 text-warning">
                        <i class="bi bi-exclamation-circle" style="font-size: 4rem;"></i>
                    </div>
                    <h4 class="fw-bold">Xác nhận nộp bài?</h4>
                    <p class="text-muted">Bạn vẫn còn <span id="remainingTimeInfo">--:--</span> thời gian. Bạn có chắc chắn muốn kết thúc bài thi ngay bây giờ?</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <button class="btn btn-light px-4 rounded-pill fw-bold" data-bs-dismiss="modal">Kiểm tra lại</button>
                        <button class="btn btn-primary px-4 rounded-pill fw-bold" onclick="executeSubmit()">Đồng ý nộp bài</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const assigningId = document.body.dataset.assigningId;
        let quizData = null;
        let currentIndex = 0;
        let userAnswers = {}; // questionId -> [answerIds]
        let timerInterval = null;
        let endTime = null;
        let viewMode = 'single'; // 'single' or 'full'

        document.addEventListener('DOMContentLoaded', initQuiz);

        async function initQuiz() {
            try {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                const response = await fetch(`/api/student/quiz/start?assigningId=${assigningId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!response.ok) throw new Error("Không thể tải bài thi");
                quizData = await response.json();

                // Initialize answers from server first, then local as backup
                userAnswers = quizData.selectedAnswers || {};
                const saved = localStorage.getItem(`quiz_answers_${quizData.attemptId}`);
                if (saved) {
                    const localData = JSON.parse(saved);
                    Object.assign(userAnswers, localData);
                }

                setupTimer();
                renderView();
                renderGrid();
                updateStats();

                document.getElementById('examTitle').textContent = quizData.quizTitle;
                document.getElementById('pageLoading').style.display = 'none';

            } catch (error) {
                alert(error.message);
                window.location.href = '/student';
            }
        }

        function setupTimer() {
            const startedAt = new Date(quizData.startedAt);
            const durationMs = quizData.durationInMins * 60 * 1000;
            endTime = new Date(startedAt.getTime() + durationMs);

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const now = new Date();
            const diff = endTime - now;

            if (diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').textContent = "00:00";
                autoSubmit();
                return;
            }

            const mins = Math.floor(diff / 1000 / 60);
            const secs = Math.floor((diff / 1000) % 60);
            
            const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;

            if (mins < 5) {
                document.getElementById('timerBox').classList.add('timer-warning');
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btnSingleMode').classList.toggle('active', mode === 'single');
            document.getElementById('btnFullMode').classList.toggle('active', mode === 'full');
            
            document.getElementById('singleModeView').style.display = mode === 'single' ? 'block' : 'none';
            document.getElementById('fullModeView').style.display = mode === 'full' ? 'block' : 'none';
            
            renderView();
            renderGrid();
        }

        function renderView() {
            if (viewMode === 'single') {
                renderSingleQuestion();
            } else {
                renderFullQuiz();
            }
        }

        function renderSingleQuestion() {
            const q = quizData.questions[currentIndex];
            document.getElementById('qNumber').textContent = `Câu ${currentIndex + 1}`;
            document.getElementById('qType').textContent = q.type === 'SINGLE_CHOICE' ? 'CHỌN MỘT ĐÁP ÁN' : 'CHỌN NHIỀU ĐÁP ÁN';
            document.getElementById('qText').textContent = q.text;

            const list = document.getElementById('answersList');
            list.innerHTML = '';

            q.answers.forEach((ans, i) => {
                const div = document.createElement('div');
                div.className = `answer-opt ${isAnswerSelected(q.id, ans.id) ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="opt-prefix">${String.fromCharCode(65 + i)}</div>
                    <div class="opt-text">${ans.text}</div>
                `;
                div.onclick = () => toggleAnswer(q.id, ans.id, q.type);
                list.appendChild(div);
            });

            // Update Nav Buttons
            document.getElementById('btnPrev').disabled = currentIndex === 0;
            document.getElementById('btnNext').innerHTML = currentIndex === quizData.questions.length - 1 
                ? 'Câu cuối cùng' 
                : 'Câu tiếp theo <i class="bi bi-chevron-right"></i>';
        }

        function renderFullQuiz() {
            const container = document.getElementById('fullModeView');
            container.innerHTML = '';

            quizData.questions.forEach((q, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'full-mode-question';
                qDiv.id = `q-full-${idx}`;
                
                let answersHtml = '';
                q.answers.forEach((ans, i) => {
                    answersHtml += `
                        <div class="answer-opt ${isAnswerSelected(q.id, ans.id) ? 'selected' : ''}" 
                             onclick="toggleAnswer(${q.id}, ${ans.id}, '${q.type}')">
                            <div class="opt-prefix">${String.fromCharCode(65 + i)}</div>
                            <div class="opt-text">${ans.text}</div>
                        </div>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="mb-3">
                        <span class="q-type-badge">Câu ${idx + 1}</span>
                        <span class="q-type-badge text-muted">${q.type === 'SINGLE_CHOICE' ? 'CHỌN MỘT ĐÁP ÁN' : 'CHỌN NHIỀU ĐÁP ÁN'}</span>
                    </div>
                    <div class="fw-bold fs-5 mb-3">${q.text}</div>
                    <div class="answers-list">${answersHtml}</div>
                `;
                container.appendChild(qDiv);
            });
        }

        function toggleAnswer(qId, ansId, type) {
            if (type === 'SINGLE_CHOICE') {
                userAnswers[qId] = [ansId];
            } else {
                if (!userAnswers[qId]) userAnswers[qId] = [];
                const idx = userAnswers[qId].indexOf(ansId);
                if (idx > -1) userAnswers[qId].splice(idx, 1);
                else userAnswers[qId].push(ansId);
            }
            
            saveToLocal();
            saveToServer(qId, userAnswers[qId]);
            renderView(); // Changed from renderQuestion
            renderGrid();
            updateStats();
        }

        function isAnswerSelected(qId, ansId) {
            return userAnswers[qId] && userAnswers[qId].includes(ansId);
        }

        function saveToLocal() {
            localStorage.setItem(`quiz_answers_${quizData.attemptId}`, JSON.stringify(userAnswers));
        }

        async function saveToServer(qId, answerIds) {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                await fetch(`/api/student/quiz/save-answer?attemptId=${quizData.attemptId}&questionId=${qId}`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(answerIds)
                });
            } catch (e) {
                console.error("Lỗi khi lưu đáp án lên server:", e);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('qGrid');
            grid.innerHTML = '';
            quizData.questions.forEach((q, i) => {
                const dot = document.createElement('div');
                dot.className = `q-dot ${i === currentIndex && viewMode === 'single' ? 'active' : ''} ${userAnswers[q.id] && userAnswers[q.id].length > 0 ? 'answered' : ''}`;
                dot.textContent = i + 1;
                dot.onclick = () => {
                    currentIndex = i;
                    if (viewMode === 'full') {
                        document.getElementById(`q-full-${i}`).scrollIntoView({ behavior: 'smooth' });
                    } else {
                        renderView();
                    }
                    renderGrid();
                };
                grid.appendChild(dot);
            });
        }

        function updateStats() {
            const total = quizData.questions.length;
            const answered = Object.values(userAnswers).filter(a => a.length > 0).length;
            document.getElementById('progressText').textContent = `${viewMode === 'single' ? (currentIndex + 1) : 'Toàn bộ'}/${total}`;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('progressBar').style.width = (answered / total * 100) + '%';
        }

        function nextQuestion() {
            if (currentIndex < quizData.questions.length - 1) {
                currentIndex++;
                renderView();
                renderGrid();
                updateStats();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderView();
                renderGrid();
                updateStats();
            }
        }

        function submitQuiz() {
            document.getElementById('remainingTimeInfo').textContent = document.getElementById('timerDisplay').textContent;
            new bootstrap.Modal(document.getElementById('submitModal')).show();
        }

        async function executeSubmit() {
            document.getElementById('pageLoading').style.display = 'flex';
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const submitBtn = document.querySelector('#submitModal .btn-primary');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang nộp...';

            try {
                // Prepare request body
                const questions = quizData.questions.map(q => ({
                    questionId: q.id,
                    answerIds: userAnswers[q.id] || []
                }));

                const response = await fetch('/api/student/quiz/submit', {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        attemptId: quizData.attemptId,
                        questions: questions
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    localStorage.removeItem(`quiz_answers_${quizData.attemptId}`);
                    window.location.href = `/student/quiz/result/${result.id}`;
                } else {
                    throw new Error("Lỗi khi nộp bài");
                }
            } catch (error) {
                alert(error.message);
                document.getElementById('pageLoading').style.display = 'none';
            }
        }

        function autoSubmit() {
            alert("Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
            executeSubmit();
        }

        function confirmExit() {
            if (confirm("Dữ liệu bài thi đang được lưu lại. Bạn có chắc chắn muốn thoát ra ngoài?")) {
                window.location.href = '/student';
            }
        }
    </script>
</body>
</html>
