<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem thử Đề Thi | QuizHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .page-title { font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 1.75rem; color: #0f172a; margin: 0; }
        .card-panel { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 24px; }
        .qbadge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; }
        .qbadge-exam { background: #fef3c7; color: #d97706; }
        .qbadge-quiz { background: #dbeafe; color: #1d4ed8; }
        .qbadge-draft { background: #f1f5f9; color: #94a3b8; }
        .qbadge-pub { background: #dcfce7; color: #15803d; }
        .ans-row { padding: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; margin-bottom: 8px; font-size: 0.92rem; font-weight: 500; background: #fff; transition: all 0.2s; }
        .ans-row.correct { border-color: #10b981; background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body>
    <header th:replace="~{layout/header :: student-header(activePage='myqbank')}"></header>

    <main class="container py-4" style="margin-top: 80px;">
        <input type="hidden" id="quizIdInput" th:value="${quizId}">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="page-title"><i class="bi bi-eye-fill text-indigo me-2"></i>Xem Thử Đề Thi</h1>
                <p class="text-muted mb-0">Xem chi tiết các câu hỏi và đáp án của đề thi.</p>
            </div>
            <div>
                <a href="/student/categories/mine" class="btn btn-light fw-bold" style="border-radius:12px; padding:10px 24px;"><i class="bi bi-arrow-left"></i> Trở về</a>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Panel: Quiz info -->
            <div class="col-lg-4">
                <div class="card-panel">
                    <div id="quiz-meta-wrapper">
                        <div class="text-center py-4"><span class="spinner-border text-indigo"></span></div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Quiz questions -->
            <div class="col-lg-8">
                <div class="card-panel">
                    <h5 class="fw-bold mb-3 text-indigo"><i class="bi bi-collection-fill me-1"></i> Danh sách câu hỏi</h5>
                    <div id="quiz-questions-wrapper">
                        <!-- Questions listed here via JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const quizId = document.getElementById('quizIdInput').value;

        document.addEventListener('DOMContentLoaded', async () => {
            if (quizId) {
                await loadQuizDetails();
            }
        });

        async function loadQuizDetails() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch(`/api/student/quiz/${quizId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    const q = await res.json();
                    renderQuizMeta(q);
                    renderQuizQuestions(q.questions || []);
                }
            } catch (err) {
                console.error('Lỗi tải đề thi', err);
            }
        }

        function renderQuizMeta(q) {
            const wrap = document.getElementById('quiz-meta-wrapper');
            const typeBadge = q.isExam
                ? `<span class="qbadge qbadge-exam"><i class="bi bi-mortarboard-fill"></i> Đề thi</span>`
                : `<span class="qbadge qbadge-quiz"><i class="bi bi-journal-check"></i> Quiz</span>`;
            const statusBadge = q.isDraft
                ? `<span class="qbadge qbadge-draft"><i class="bi bi-cone-striped"></i> Bản nháp</span>`
                : `<span class="qbadge qbadge-pub"><i class="bi bi-check-circle-fill"></i> Xuất bản</span>`;

            wrap.innerHTML = `
                ${q.imageUrl ? `<img src="${q.imageUrl}" alt="Quiz Image" class="img-fluid rounded mb-3" style="max-height:180px; object-fit:cover; width:100%;">` : ''}
                <div class="d-flex gap-2 mb-3">${typeBadge} ${statusBadge}</div>
                <h3 class="fw-bold text-dark" style="font-family:'Nunito Sans'; font-size:1.35rem;">${esc(q.title)}</h3>
                <p class="text-muted small mb-3">${esc(q.description) || '<i>Không có mô tả.</i>'}</p>
                <hr>
                <div class="d-flex flex-column gap-2">
                    <div class="d-flex justify-content-between"><span class="text-muted small fw-bold">Tổng số câu hỏi:</span> <span class="fw-bold">${q.questions ? q.questions.length : (q.questionCount || 0)} câu</span></div>
                    <div class="d-flex justify-content-between"><span class="text-muted small fw-bold">Danh mục:</span> <span class="fw-bold">${q.category ? esc(q.category.name) : 'Hệ thống'}</span></div>
                    <div class="d-flex justify-content-between"><span class="text-muted small fw-bold">Tạo bởi:</span> <span class="fw-bold">${esc(q.creatorName) || 'Bạn'}</span></div>
                </div>
            `;
        }

        function renderQuizQuestions(questions) {
            const wrap = document.getElementById('quiz-questions-wrapper');
            if (!questions || questions.length === 0) {
                wrap.innerHTML = `<p class="text-muted text-center py-4">Đề thi này chưa có câu hỏi nào.</p>`;
                return;
            }

            wrap.innerHTML = questions.map((q, i) => {
                let typeLabel = q.type === 'SINGLE_CHOICE' ? 'Trắc nghiệm 1 đáp án' : (q.type === 'MULTIPLE_CHOICE' ? 'Trắc nghiệm nhiều đáp án' : 'Điền khuyết');
                let levelLabel = q.level === 'EASY' ? 'Dễ' : (q.level === 'MEDIUM' ? 'Trung bình' : 'Khó');

                return `
                    <div class="mb-4 bg-white p-3 border rounded shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-indigo fw-bold">Câu hỏi ${i + 1}</span>
                            <div class="d-flex gap-2">
                                <span class="badge bg-light text-dark border px-2 py-1">${typeLabel}</span>
                                <span class="badge bg-light text-dark border px-2 py-1">${levelLabel}</span>
                            </div>
                        </div>
                        <div class="fw-bold mb-3" style="font-size:1rem; color:#1e293b;">${esc(q.text)}</div>
                        <div class="ans-list">
                            ${q.answers && q.answers.length > 0 ? q.answers.map((a, idx) => `
                                <div class="ans-row ${a.isCorrect ? 'correct' : ''}">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="fw-bold">${String.fromCharCode(65 + idx)}.</span>
                                        <span>${esc(a.text)}</span>
                                        ${a.isCorrect ? `<i class="bi bi-check-circle-fill ms-auto"></i>` : ''}
                                    </div>
                                </div>
                            `).join('') : '<p class="text-muted small">Không có đáp án.</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    </script>
</body>
</html>
