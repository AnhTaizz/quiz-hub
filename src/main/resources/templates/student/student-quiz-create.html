<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Đề Thi | QuizHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .page-title { font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 1.75rem; color: #0f172a; margin: 0; }
        .card-panel { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); height: 100%; display: flex; flex-direction: column; }
        .fc { border-radius: 12px; border: 1.5px solid #e2e8f0; padding: 12px; font-size: 0.95rem; font-weight: 500; width: 100%; transition: border-color 0.2s; }
        .fc:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .question-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; transition: all 0.2s; cursor: pointer; }
        .question-card:hover { border-color: #cbd5e1; background: #f8fafc; }
        .question-card.selected { border-color: #4f46e5; background: #eff6ff; }
        .qbadge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; }
        .qbadge-type { background: #e0e7ff; color: #4338ca; }
        .qbadge-level { background: #ede9fe; color: #7c3aed; }
        .right-scroller { max-height: 550px; overflow-y: auto; padding-right: 4px; }
        .right-scroller::-webkit-scrollbar { width: 5px; }
        .right-scroller::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        #toastWrap { position: fixed; top: 22px; right: 22px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast-msg { background: #1e1b4b; color: #fff; border-radius: 14px; padding: 12px 18px; font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 9px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); opacity: 0; transform: translateX(16px); transition: all 0.3s ease; }
        .toast-msg.show { opacity: 1; transform: translateX(0); }
        .toast-msg.ok i { color: #4ade80; }
        .toast-msg.err i { color: #fb7185; }
    </style>
</head>
<body>
    <header th:replace="~{layout/header :: student-header}"></header>

    <main class="container py-4" style="margin-top: 80px;">
        <!-- Hidden input storing info from Thymeleaf -->
        <input type="hidden" id="quizIdInput" th:value="${quizId}">
        <input type="hidden" id="categoryIdInput" th:value="${categoryId}">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="page-title"><i class="bi bi-file-earmark-plus-fill text-indigo me-2"></i>Soạn Đề Thi Mới</h1>
                <p class="text-muted mb-0">Tạo đề thi thủ công bằng cách chọn các câu hỏi từ kho cá nhân.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="/student/categories/mine" class="btn btn-light fw-bold" style="border-radius:12px; padding:10px 24px;"><i class="bi bi-arrow-left"></i> Trở về</a>
                <button type="button" class="btn btn-primary fw-bold" onclick="saveQuiz()" style="border-radius:12px; padding:10px 24px; background:linear-gradient(135deg, #4f46e5, #7c3aed); border:none;"><i class="bi bi-floppy-fill me-1"></i> Lưu Đề Thi</button>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left: Metadata Panel -->
            <div class="col-lg-5">
                <div class="card-panel">
                    <h5 class="fw-bold mb-3 text-indigo"><i class="bi bi-info-circle me-1"></i> 1. Thông tin Đề thi</h5>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted mb-1">Tiêu đề đề thi <span class="text-danger">*</span></label>
                        <input type="text" id="quiz-title" class="fc" placeholder="Ví dụ: Kiểm tra giữa kỳ môn Tiếng Anh" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted mb-1">Mô tả (Ngắn gọn)</label>
                        <textarea id="quiz-desc" class="fc" rows="3" placeholder="Ví dụ: Ôn tập kiến thức bài 1 đến bài 5..." autocomplete="off"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted mb-1">Chọn Danh mục Lưu Trữ <span class="text-danger">*</span></label>
                        <select id="quiz-category" class="form-select fc" required>
                            <option value="">-- Chọn danh mục --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted mb-1">Ảnh đại diện đề thi (URL)</label>
                        <input type="text" id="quiz-image" class="fc" placeholder="https://..." autocomplete="off">
                    </div>
                    <div class="row g-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-muted mb-1">Trạng thái phát hành</label>
                            <select id="quiz-isDraft" class="form-select fc">
                                <option value="false" selected>Đã xuất bản (Published)</option>
                                <option value="true">Bản nháp (Draft)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-muted mb-1">Loại đề thi</label>
                            <select id="quiz-isExam" class="form-select fc">
                                <option value="false" selected>Quiz luyện tập</option>
                                <option value="true">Đề thi (Exam)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Question Selection Panel -->
            <div class="col-lg-7">
                <div class="card-panel">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold mb-0 text-indigo"><i class="bi bi-collection-fill me-1"></i> 2. Chọn câu hỏi</h5>
                        <span class="badge bg-indigo text-white fw-bold px-3 py-2" id="selected-count" style="border-radius:10px; font-size:0.85rem;">Đã chọn 0 câu hỏi</span>
                    </div>

                    <!-- Search & Filtering in Questions Bank -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-12">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0" style="border-radius:12px 0 0 12px;"><i class="bi bi-search"></i></span>
                                <input type="text" id="q-search" class="form-control fc border-start-0" placeholder="Tìm kiếm nội dung..." style="border-radius:0 12px 12px 0;" onkeyup="loadQuestions()">
                            </div>
                        </div>
                    </div>

                    <div class="right-scroller" id="questions-wrapper">
                        <!-- Questions populated via JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const quizId = document.getElementById('quizIdInput').value;
        const initialCategoryId = document.getElementById('categoryIdInput').value;

        let availableCategories = [];
        let questionsList = [];
        let selectedQuestionIds = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchCategories();
            if (quizId) {
                await fetchQuizToEdit();
            } else {
                if (initialCategoryId) {
                    document.getElementById('quiz-category').value = initialCategoryId;
                }
                await loadQuestions();
            }
        });

        async function fetchCategories() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch('/api/student/categories/mine', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    availableCategories = await res.json();
                    populateCategorySelect(availableCategories);
                }
            } catch (err) {
                console.error('Lỗi tải danh mục', err);
            }
        }

        function populateCategorySelect(nodes, level = 0) {
            const select = document.getElementById('quiz-category');
            if (level === 0) select.innerHTML = '<option value="">-- Chọn danh mục --</option>';
            nodes.forEach(n => {
                select.innerHTML += `<option value="${n.id}">${'&nbsp;'.repeat(level * 4)}${esc(n.name)}</option>`;
                if (n.children && n.children.length > 0) {
                    populateCategorySelect(n.children, level + 1);
                }
            });
        }

        async function fetchQuizToEdit() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch(`/api/student/quizzes/${quizId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    const q = await res.json();
                    document.getElementById('quiz-title').value = q.title || '';
                    document.getElementById('quiz-desc').value = q.description || '';
                    document.getElementById('quiz-image').value = q.imageUrl || '';
                    document.getElementById('quiz-isDraft').value = String(q.isDraft);
                    document.getElementById('quiz-isExam').value = String(q.isExam);
                    document.getElementById('quiz-category').value = q.category ? q.category.id : '';

                    if (q.questionIds) {
                        q.questionIds.forEach(id => selectedQuestionIds.add(id));
                    } else if (q.questions) {
                        q.questions.forEach(qi => selectedQuestionIds.add(qi.id));
                    }
                    updateSelectedCount();
                    await loadQuestions();
                }
            } catch (err) {
                showToast('Không thể tải thông tin đề thi để sửa', 'err');
            }
        }

        async function loadQuestions() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const search = document.getElementById('q-search').value;

            const url = `/api/student/questions?keyword=${encodeURIComponent(search)}&page=0&size=150`;

            const wrapper = document.getElementById('questions-wrapper');
            wrapper.innerHTML = `<div class="text-center py-4"><span class="spinner-border text-indigo"></span><p class="text-muted mt-2">Đang tìm kiếm câu hỏi...</p></div>`;

            try {
                const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    questionsList = data.content || [];
                    renderQuestions();
                }
            } catch (err) {
                showToast('Lỗi tải danh sách câu hỏi!', 'err');
            }
        }

        function renderQuestions() {
            const wrapper = document.getElementById('questions-wrapper');
            if (questionsList.length === 0) {
                wrapper.innerHTML = `<p class="text-muted py-4 text-center">Không tìm thấy câu hỏi phù hợp.</p>`;
                return;
            }

            wrapper.innerHTML = questionsList.map(q => {
                const isSelected = selectedQuestionIds.has(q.id);
                let typeLabel = q.type === 'SINGLE_CHOICE' ? '1 đáp án' : (q.type === 'MULTIPLE_CHOICE' ? 'Nhiều đáp án' : 'Điền khuyết');
                let levelLabel = q.level === 'EASY' ? 'Dễ' : (q.level === 'MEDIUM' ? 'Trung bình' : 'Khó');

                let ansHtml = '';
                if (q.answers && q.answers.length > 0) {
                    ansHtml = `<div class="ans-list mt-2 bg-light p-2 rounded" style="font-size:0.82rem; border:1px solid #e2e8f0; display:none;" id="ans-${q.id}">
                        ${q.answers.map((a, idx) => `
                            <div class="${a.isCorrect ? 'text-success fw-bold' : 'text-muted'}">
                                ${String.fromCharCode(65 + idx)}. ${esc(a.text)}
                            </div>`).join('')}
                    </div>`;
                }

                return `<div class="question-card ${isSelected ? 'selected' : ''}" onclick="toggleQuestionSelection(${q.id}, event)" style="position: relative;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div class="d-flex gap-2">
                            <span class="qbadge qbadge-type"><i class="bi bi-patch-check"></i> ${typeLabel}</span>
                            <span class="qbadge qbadge-level"><i class="bi bi-graph-up"></i> ${levelLabel}</span>
                        </div>
                        <button type="button" class="btn btn-sm btn-light border p-1" onclick="toggleAnswers(${q.id}); event.stopPropagation();" title="Xem chi tiết câu trả lời" style="border-radius:8px;">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="fw-bold text-dark mt-2 mb-1" style="font-size: 0.95rem;">${esc(q.text)}</div>
                    ${ansHtml}
                    <div style="position:absolute; top: 14px; right: 14px;">
                        <input type="checkbox" class="form-check-input" style="width:20px;height:20px; accent-color:#4f46e5;" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleQuestionSelection(${q.id}, event)">
                    </div>
                </div>`;
            }).join('');
        }

        function toggleAnswers(id) {
            const el = document.getElementById(`ans-${id}`);
            if (el) {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
            }
        }

        function toggleQuestionSelection(id, event) {
            if (event) event.stopPropagation();
            if (selectedQuestionIds.has(id)) {
                selectedQuestionIds.delete(id);
            } else {
                selectedQuestionIds.add(id);
            }
            updateSelectedCount();
            renderQuestions();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = `Đã chọn ${selectedQuestionIds.size} câu hỏi`;
        }

        async function saveQuiz() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const title = document.getElementById('quiz-title').value.trim();
            const description = document.getElementById('quiz-desc').value.trim();
            const imageUrl = document.getElementById('quiz-image').value.trim();
            const categoryId = document.getElementById('quiz-category').value;
            const isDraft = document.getElementById('quiz-isDraft').value === 'true';
            const isExam = document.getElementById('quiz-isExam').value === 'true';

            if (!title) { showToast('Vui lòng nhập tiêu đề đề thi!', 'err'); return; }
            if (!categoryId) { showToast('Vui lòng chọn danh mục đề thi!', 'err'); return; }
            if (selectedQuestionIds.size === 0) { showToast('Hãy chọn ít nhất 1 câu hỏi để tạo đề thi!', 'err'); return; }

            const payload = {
                title,
                description,
                imageUrl,
                categoryId: parseInt(categoryId),
                isDraft,
                isExam,
                questionIds: Array.from(selectedQuestionIds)
            };

            const url = quizId ? `/api/student/quizzes/${quizId}` : '/api/student/quizzes';
            const method = quizId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    showToast(quizId ? 'Cập nhật đề thi thành công!' : 'Tạo đề thi mới thành công!', 'ok');
                    setTimeout(() => window.location.href = '/student/categories/mine', 1200);
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Lỗi khi lưu đề thi', 'err');
                }
            } catch (err) {
                showToast('Có lỗi xảy ra khi lưu đề thi', 'err');
            }
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        function showToast(msg, type = 'ok') {
            const w = document.getElementById('toastWrap');
            const t = document.createElement('div');
            t.className = `toast-msg ${type}`;
            t.innerHTML = `<i class="bi ${type === 'ok' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'}"></i> ${msg}`;
            w.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
        }
    </script>
</body>
</html>
