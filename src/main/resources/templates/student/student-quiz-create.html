<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soạn Đề Thi | QuizHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .page-title { font-family: 'Nunito Sans', sans-serif; font-weight: 900; font-size: 1.75rem; color: #1e1b4b; margin: 0; }
        .card-panel { background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03); }
        .fc { border-radius: 12px; border: 1.5px solid #e2e8f0; padding: 11px 14px; font-size: 0.92rem; font-weight: 500; width: 100%; transition: all 0.2s ease; }
        .fc:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .question-card { border: 1.5px solid #f1f5f9; border-radius: 18px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; background: #fff; }
        .question-card:hover { border-color: #c7d2fe; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.08); }
        .question-card.selected { border-color: #4f46e5; background: #f5f7ff; box-shadow: 0 8px 25px rgba(79, 70, 229, 0.12); }
        .qbadge { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .qbadge-type { background: #e0e7ff; color: #4338ca; }
        .qbadge-level { background: #f1f5f9; color: #64748b; }
        .right-scroller::-webkit-scrollbar { width: 6px; }
        .right-scroller::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .btn-submit-quiz { background: linear-gradient(135deg, #4f46e5, #4338ca); color: #fff; border: none; border-radius: 14px; padding: 12px 30px; font-weight: 800; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); transition: all 0.3s ease; }
        .btn-submit-quiz:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4); opacity: 0.95; }
        #toastWrap { position: fixed; top: 22px; right: 22px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { background: #1e1b4b; color: #fff; border-radius: 16px; padding: 14px 22px; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); opacity: 0; transform: translateY(-20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-msg.show { opacity: 1; transform: translateY(0); }
        .toast-msg.err { border-left: 4px solid #ef4444; }
        .toast-msg.ok { border-left: 4px solid #10b981; }
        .category-selectable-name:hover { color: #4338ca !important; text-decoration: underline; cursor: pointer; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>

<body>
    <header th:replace="~{layout/header :: student-header(activePage='myqbank')}"></header>

    <main id="main-content" class="container" style="padding-top: 100px; padding-bottom: 80px;">
        <!-- Hidden inputs for logic -->
        <input type="hidden" id="quizIdInput" th:value="${quizId}">
        <input type="hidden" id="categoryIdInput" th:value="${categoryId}">

        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <div>
                <h1 class="page-title"><i class="bi bi-magic me-2 text-indigo"></i>Soạn Đề Thi Cá Nhân</h1>
                <p class="text-muted small fw-medium">Tự do sáng tạo lộ trình học tập của riêng bạn.</p>
            </div>
            <div class="d-flex gap-3">
                <a href="/student/categories?type=mine" class="btn btn-light fw-bold rounded-4 px-4 border-0 shadow-sm" style="background: #fff; color: #64748b;">
                    <i class="bi bi-chevron-left me-1"></i> Quay lại
                </a>
                <button type="button" class="btn btn-submit-quiz" onclick="saveQuiz()">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i> Lưu Đề Thi
                </button>
            </div>
        </div>

        <!-- Injecting the Unified Quiz Editor UI -->
        <div th:replace="~{fragments/quiz-editor :: quiz-editor-ui(userType='student')}"></div>
    </main>

    <!-- Modals -->
    <div th:replace="~{fragments/quiz-editor :: quiz-editor-modals}"></div>
    <div th:replace="~{fragments/category-explorer-public :: category-explorer-public-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-create-modal}"></div>

    <div id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Injecting the Unified Quiz Editor Logic -->
    <div th:replace="~{fragments/quiz-editor :: quiz-editor-scripts(userType='student')}"></div>
</body>

</html>
