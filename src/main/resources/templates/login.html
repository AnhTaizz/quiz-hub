<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | QuizHub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div id="toast-container"></div>

    <div class="auth-card">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-logo">
                <i class="bi bi-layers-fill" style="color: #6366f1;"></i>
                <span style="color: #fff;">Quiz</span><span style="color: #6366f1;">Hub</span>
            </a>
            <h2>Chào mừng trở lại</h2>
            <p>Đăng nhập để tiếp tục hành trình của bạn</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" class="form-control-auth" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" class="form-control-auth" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,0.6); cursor: pointer;">
                    <input type="checkbox" style="accent-color: #6366f1;"> Ghi nhớ tôi
                </label>
                <a href="#" style="font-size: 14px; color: #818cf8; text-decoration: none;">Quên mật khẩu?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-auth">
                <span>Đăng nhập</span>
                <i class="bi bi-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký miễn phí</a>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitText = submitBtn.querySelector('span');
            
            // UI Loading state
            submitBtn.disabled = true;
            submitText.textContent = 'Đang xử lý...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Lưu vào localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.id,
                        email: data.email,
                        fullName: data.fullName,
                        role: data.role
                    }));

                    showToast('Đăng nhập thành công!', 'success');
                    
                    // Chuyển hướng sau 1 giây
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    const errorMsg = data.message || 'Email hoặc mật khẩu không chính xác';
                    showToast(errorMsg, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Đã có lỗi xảy ra. Vui lòng thử lại sau.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Đăng nhập';
            }
        });

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
            
            toast.innerHTML = `
                <i class="bi ${icon}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
