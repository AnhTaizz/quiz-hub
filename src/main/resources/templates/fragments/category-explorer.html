<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

    <!-- 1️⃣ Fragment: Category Explorer Modal (Chọn danh mục) -->
    <div th:fragment="category-explorer-modal" class="modal fade" id="categoryExplorerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header border-0 p-4" style="background: linear-gradient(135deg, #4f46e5, #3730a3); color: #ffffff;">
                    <h5 class="modal-title fw-bold text-white mb-0" style="color: #ffffff !important;">
                        <i class="bi bi-folder2-open me-2"></i>Chọn Danh mục
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <!-- Nav Tabs for filtering categories -->
                    <ul class="nav nav-pills mb-3 gap-2" id="categoryTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active px-3 py-2 fw-bold" id="my-categories-tab" data-bs-toggle="pill" data-bs-target="#myCategoriesPane" type="button" role="tab" style="border-radius: 10px;">
                                <i class="bi bi-person-fill"></i> Của tôi
                            </button>
                        </li>
                        <li class="nav-item" role="presentation" id="public-categories-tab-li">
                            <button class="nav-link px-3 py-2 fw-bold" id="public-categories-tab" data-bs-toggle="pill" data-bs-target="#publicCategoriesPane" type="button" role="tab" style="border-radius: 10px;">
                                <i class="bi bi-globe2"></i> Công khai
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="categoryTabContent">
                        <div class="tab-pane fade show active" id="myCategoriesPane" role="tabpanel" tabindex="0">
                            <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i> Bấm vào tên danh mục để chọn.</p>
                            <div id="my-category-tree-container" style="max-height: 350px; overflow-y: auto; padding: 5px;">
                                <!-- JS renders my categories here -->
                            </div>
                        </div>
                        <div class="tab-pane fade" id="publicCategoriesPane" role="tabpanel" tabindex="0">
                            <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i> Bấm vào tên danh mục để chọn.</p>
                            <div id="public-category-tree-container" style="max-height: 350px; overflow-y: auto; padding: 5px;">
                                <!-- JS renders public categories here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2️⃣ Fragment: Category Create / Edit Modal (Tạo & Sửa danh mục) -->
    <div th:fragment="category-create-modal" class="modal fade" id="categoryCreateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header border-0 p-4" style="background: linear-gradient(135deg, #0d9488, #0f766e); color: #ffffff;">
                    <h5 class="modal-title fw-bold text-white mb-0" id="categoryCreateTitle" style="color: #ffffff !important;">
                        <i class="bi bi-folder-plus me-2"></i>Tạo danh mục mới
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="categoryCreateForm" onsubmit="event.preventDefault(); submitCategoryCreateForm();">
                        <input type="hidden" id="categoryCreateId">
                        <input type="hidden" id="categoryCreateParentId">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" id="categoryCreateName" class="form-control" style="border-radius: 12px; padding: 10px 14px;" placeholder="Ví dụ: Lập trình Java, Toán cao cấp..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Mô tả</label>
                            <textarea id="categoryCreateDesc" class="form-control" rows="3" style="border-radius: 12px; padding: 10px 14px;" placeholder="Nhập mô tả cho danh mục này..."></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-4">
                            <button type="button" class="btn btn-light px-4 py-2 fw-bold" style="border-radius: 10px;" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-success px-4 py-2 fw-bold" style="border-radius: 10px;">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 3️⃣ Fragment: Private Category Explorer Modal (Chỉ xem danh mục cá nhân) -->
    <div th:fragment="category-explorer-private-modal" class="modal fade" id="categoryExplorerPrivateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header border-0 p-4" style="background: linear-gradient(135deg, #4f46e5, #3730a3); color: #ffffff;">
                    <h5 class="modal-title fw-bold text-white mb-0" style="color: #ffffff !important;">
                        <i class="bi bi-folder2-open me-2"></i>Chọn Danh mục của bạn
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i> Bấm vào tên danh mục để chọn.</p>
                    <div id="private-category-tree-container" style="max-height: 350px; overflow-y: auto; padding: 5px;">
                        <!-- JS renders my categories here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
