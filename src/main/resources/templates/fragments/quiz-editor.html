<div th:fragment="question-selection-panel" class="card-panel">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="fw-bold mb-0" style="color: #1e1b4b;">
            <i class="bi bi-collection-fill me-1" style="color: #6366f1;"></i> 2. Chọn câu hỏi
        </h5>
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary fw-bold" data-bs-toggle="modal"
                data-bs-target="#createOnTheFlyQuestionModal"
                style="border-radius:10px; border-color:#4f46e5 !important; color:#4f46e5 !important;">
                <i class="bi bi-plus-circle me-1"></i>Tạo câu hỏi thủ công
            </button>
            <span class="badge bg-indigo text-white fw-bold px-3 py-2" id="selected-count"
                style="border-radius:10px; font-size:0.85rem; background: #4338ca;">Đã chọn 0 câu hỏi</span>
        </div>
    </div>

    <!-- Filter Bar Row 1 -->
    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"
                    style="border-radius:12px 0 0 12px; border-color: #e2e8f0;">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" id="q-search" class="form-control fc border-start-0"
                    placeholder="Tìm kiếm nội dung..." style="border-radius:0 12px 12px 0;"
                    onkeyup="loadQuestions()">
            </div>
        </div>
        <div class="col-md-6 d-flex gap-2">
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0" style="border-radius:12px 0 0 12px; border-color: #e2e8f0; font-size: 0.85rem; font-weight: 700; color: #64748b;">LỌC DANH MỤC</span>
                <input type="text" id="q-category-filter-display"
                    class="form-control fc bg-white cursor-pointer border-start-0" placeholder="Tất cả danh mục"
                    readonly onclick="openCategoryTreePicker('filter')"
                    style="border-radius:0 12px 12px 0;">
                <input type="hidden" id="q-category-filter">
                <input type="hidden" id="q-source" value="mine">
            </div>
        </div>
    </div>

    <!-- Filter Bar Row 2 -->
    <div class="row g-2 mb-3">
        <div class="col-md-6 d-flex gap-2">
            <select id="q-type" class="form-select fc" onchange="loadQuestions()">
                <option value="">Tất cả loại câu</option>
                <option value="SINGLE_CHOICE">Một đáp án</option>
                <option value="MULTIPLE_CHOICE">Nhiều đáp án</option>
                <option value="FILL_IN_BLANK">Điền khuyết</option>
            </select>
            <select id="q-level" class="form-select fc" onchange="filterLocalQuestions()">
                <option value="">Tất cả độ khó</option>
                <option value="EASY">Dễ (Easy)</option>
                <option value="MEDIUM">Trung bình (Medium)</option>
                <option value="HARD">Khó (Hard)</option>
            </select>
        </div>
        <div class="col-md-6 text-end">
            <button type="button" class="btn btn-sm btn-light text-muted fw-bold rounded-pill px-3" onclick="clearCategoryFilterSelection()">
                <i class="bi bi-x-circle me-1"></i>Xóa lọc danh mục
            </button>
        </div>
    </div>

    <div class="right-scroller" id="questions-wrapper">
        <!-- Questions populated via JS -->
    </div>
</div>
