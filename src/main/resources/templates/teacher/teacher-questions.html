<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizHub | Ngân hàng Câu hỏi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">

    <style>
        body { background-color: #f8fafc; }
        #main-content { padding: 24px; transition: all 0.3s; }
        body.sidebar-collapsed #main-content { margin-left: 70px; }
    </style>
</head>

<body>
    <script>
        (function() {
            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                document.body.classList.add('sidebar-collapsed');
            }
        })();
    </script>

    <!-- Sidebar Fragment -->
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('questions')}"></aside>

    <!-- Header Fragment -->
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content">
        <div th:replace="~{fragments/question-bank-ui :: question-bank-ui('teacher', true)}"></div>
    </main>

    <div th:replace="~{fragments/category-explorer-public :: category-explorer-public-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-create-modal}"></div>



    <!-- Toast Component -->
    <div id="toast-wrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const myCategories = /*[[${myCategories}]]*/ [];
        const publicCategories = /*[[${publicCategories}]]*/ [];
        /*]]>*/

        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.toggle-btn');
            const body = document.querySelector('body');
            if(toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    body.classList.toggle('sidebar-collapsed');
                    localStorage.setItem('sidebar-collapsed', body.classList.contains('sidebar-collapsed'));
                });
            }
        });
    </script>
</body>

</html>
