<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub | Nhật ký Vi phạm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    
    <style>
        .violation-card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .log-table {
            width: 100%;
        }
        .log-table th {
            background: #f8fafc;
            padding: 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
        }
        .log-table td {
            padding: 20px 15px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .student-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .v-type-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .v-TAB_SWITCH { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
        .v-WINDOW_BLUR { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
        .v-TAB_CLOSE { background: #450a0a; color: #fecaca; }
        .v-MANUAL_EXIT { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        
        .severity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .sev-1 { background: #f59e0b; }
        .sev-2 { background: #ef4444; }
        .sev-3 { background: #7f1d1d; }
    </style>
</head>
<body>
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('dashboard')}"></aside>
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/teacher}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Nhật ký Vi phạm</li>
                    </ol>
                </nav>
                <h3 class="fw-bold m-0">Chi tiết vi phạm: <span th:text="${assignment.quiz.title}">Đề thi giữa kỳ</span></h3>
                <p class="text-muted" th:text="${'Lớp: ' + assignment.classroom.name}">Lớp: Lập trình Java</p>
            </div>
            <button class="btn btn-outline-primary rounded-pill px-4" onclick="window.print()">
                <i class="bi bi-printer me-2"></i> Xuất báo cáo
            </button>
        </div>

        <div class="violation-card">
            <div th:if="${#lists.isEmpty(violations)}" class="text-center py-5">
                <i class="bi bi-shield-check text-success" style="font-size: 4rem;"></i>
                <h4 class="mt-3 fw-bold">Chưa có vi phạm nào!</h4>
                <p class="text-muted">Mọi thứ vẫn đang được kiểm soát tốt.</p>
            </div>

            <table th:if="${!#lists.isEmpty(violations)}" class="log-table">
                <thead>
                    <tr>
                        <th>Sinh viên</th>
                        <th>Thời điểm</th>
                        <th>Loại vi phạm</th>
                        <th>Mức độ</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${violations}">
                        <td>
                            <div class="student-info">
                                <img th:src="${v.attempt.quizTaking.learner.avatarUrl != null ? v.attempt.quizTaking.learner.avatarUrl : 'https://ui-avatars.com/api/?name=' + v.attempt.quizTaking.learner.fullName}" alt="Avatar">
                                <div>
                                    <div class="fw-bold" th:text="${v.attempt.quizTaking.learner.fullName}">Nguyễn Văn A</div>
                                    <div class="small text-muted" th:text="${v.attempt.quizTaking.learner.email}">student@gmail.com</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${#temporals.format(v.occurredAt, 'HH:mm:ss')}">10:30:05</div>
                            <div class="small text-muted" th:text="${#temporals.format(v.occurredAt, 'dd/MM/yyyy')}">04/05/2026</div>
                        </td>
                        <td>
                            <span th:class="'v-type-badge v-' + ${v.violationType.violationCode}" 
                                  th:text="${v.violationType.violationCode == 'TAB_SWITCH' ? 'Chuyển Tab' : 
                                            (v.violationType.violationCode == 'WINDOW_BLUR' ? 'Rời cửa sổ' : 
                                            (v.violationType.violationCode == 'TAB_CLOSE' ? 'Đóng Tab' : 'Thoát thủ công'))}">
                                Chuyển Tab
                            </span>
                        </td>
                        <td>
                            <span class="severity-dot" th:classappend="'sev-' + ${v.violationType.severityLevel}"></span>
                            <span th:text="${v.violationType.severityLevel == 1 ? 'Nhẹ' : (v.violationType.severityLevel == 2 ? 'Cảnh cáo' : 'Nghiêm trọng')}">Nhẹ</span>
                        </td>
                        <td class="text-muted small" th:text="${v.violationType.description}">Tự động ghi nhận bởi hệ thống.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                document.body.classList.add('sidebar-collapsed');
            }
        })();

        document.addEventListener("DOMContentLoaded", function() {
            const toggleBtn = document.querySelector('.toggle-btn');
            const body = document.querySelector('body');

            if(toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    body.classList.toggle('sidebar-collapsed');
                    localStorage.setItem('sidebar-collapsed', body.classList.contains('sidebar-collapsed'));
                });
            }
        });
    </script>
    <div th:replace="~{layout/header :: changePasswordModal}"></div>
    <script th:replace="~{layout/header :: change-password-script}"></script>
</body>
</html>
