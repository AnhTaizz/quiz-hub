<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizHub | Quản Lý Đề Thi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <!-- Flatpickr for 24h time format -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">

    <style>
        .page-fade {
            animation: fadeIn .3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 900;
            font-size: 1.75rem;
            color: #1e1b4b;
            margin: 0;
        }

        .page-sub {
            color: #64748b;
            font-size: .9rem;
            margin: 2px 0 0;
        }

        /* Toolbar/Filters styling */
        .search-and-filter {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        .fc-custom {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 8px 14px;
            font-size: .9rem;
            transition: border-color .2s;
            width: 100%;
        }

        .fc-custom:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, .1);
            outline: none;
        }

        .btn-new-quiz {
            background: linear-gradient(135deg, #4338ca, #6366f1);
            color: #fff;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 700;
            border: none;
            transition: all .2s ease;
            white-space: nowrap;
        }

        .btn-new-quiz:hover {
            opacity: .88;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(67, 56, 202, .35);
            color: #fff;
        }

        /* Quiz cards grid */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .quiz-card {
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            background: #fff;
            transition: all .25s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .02);
        }

        .quiz-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #4338ca, #6366f1);
            opacity: 0;
            transition: opacity .2s;
        }

        .quiz-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, .07);
            border-color: #a5b4fc;
            transform: translateY(-2px);
        }

        .quiz-card:hover::after {
            opacity: 1;
        }

        .quiz-badge-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .qbadge {
            font-size: .7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .qbadge-exam {
            background: #fef3c7;
            color: #d97706;
        }

        .qbadge-quiz {
            background: #dbeafe;
            color: #1d4ed8;
        }


        .quiz-title {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #1e1b4b;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .quiz-desc {
            font-size: .85rem;
            color: #64748b;
            margin-bottom: 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .quiz-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .chip {
            font-size: .75rem;
            font-weight: 600;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #64748b;
        }

        .quiz-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px dashed #f1f5f9;
        }

        .qact {
            flex: 1;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: .8rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all .2s;
            text-decoration: none;
        }

        .qact-edit {
            background: #eff6ff;
            color: #2563eb;
        }

        .qact-edit:hover {
            background: #2563eb;
            color: #fff;
        }

        .qact-view {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .qact-view:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .qact-del {
            background: #fef2f2;
            color: #dc2626;
            flex: 0 0 40px;
        }

        .qact-del:hover {
            background: #dc2626;
            color: #fff;
        }

        .qact-assign {
            background: #f0fdf4;
            color: #16a34a;
        }

        .qact-assign:hover {
            background: #16a34a;
            color: #fff;
        }

        /* Toasts and Modals */
        #toastWrap {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast-msg {
            background: #1e1b4b;
            color: #fff;
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 600;
            font-size: .88rem;
            display: flex;
            align-items: center;
            gap: 9px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateX(16px);
            transition: all .3s ease;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-msg.ok i {
            color: #4ade80;
        }

        .toast-msg.err i {
            color: #fb7185;
        }

        .skeleton {
            animation: shimmer 1.5s infinite;
            background: linear-gradient(90deg, #f4f4f4 25%, #eaeaea 50%, #f4f4f4 75%);
            background-size: 200% 100%;
            border-radius: 16px;
            height: 200px;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0
            }

            100% {
                background-position: 200% 0
            }
        }
    </style>
</head>

<body>

    <aside th:replace="~{layout/sidebar :: teacher-sidebar('quizzes')}"></aside>
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content" class="page-fade">
        <!-- Header Section -->
        <div class="d-flex align-items-center justify-content-between mb-4 gap-3 flex-wrap">
            <div>
                <h1 class="page-title">📝 Quản Lý Đề Thi</h1>
                <p class="page-sub">Xem, tìm kiếm và quản lý toàn bộ đề thi của bạn.</p>
            </div>
            <div class="dropdown">
                <button class="btn-new-quiz d-flex align-items-center gap-2 dropdown-toggle shadow-sm" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" style="border-radius:14px;">
                    <i class="bi bi-plus-lg"></i> Soạn Đề Thi Mới
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-2 p-2"
                    style="width: 260px; animation: fadeIn 0.2s ease;">
                    <li>
                        <a class="dropdown-item p-3 rounded-3 d-flex align-items-center gap-3 mb-1"
                            href="/teacher/quizzes/create">
                            <div
                                style="background:#eff6ff; color:#3b82f6; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem;">
                                <i class="bi bi-pencil-square"></i></div>
                            <div>
                                <div class="fw-bold text-dark small">Soạn thủ công</div>
                                <div class="text-muted" style="font-size:0.7rem;">Từng bước chọn câu hỏi</div>
                            </div>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item p-3 rounded-3 d-flex align-items-center gap-3"
                            href="/teacher/quizzes/quick-create">
                            <div
                                style="background:#f0fdf4; color:#16a34a; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem;">
                                <i class="bi bi-magic"></i></div>
                            <div>
                                <div class="fw-bold text-dark small">Tạo nhanh (Magic)</div>
                                <div class="text-muted" style="font-size:0.7rem;">Visual Designer: Excel/JSON</div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="search-and-filter">
            <div class="row g-3">
                <div class="col-lg-5 col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"
                            style="border-radius:12px 0 0 12px; border-color:#e2e8f0;">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control fc-custom border-start-0"
                            placeholder="Tìm kiếm đề thi..." style="border-radius:0 12px 12px 0;"
                            onkeyup="filterQuizzes()">
                    </div>
                </div>
                <div class="col-lg-7 col-md-8">
                    <div class="row g-3">
                        <div class="col-sm-12">
                            <div class="d-flex gap-2 align-items-center">
                                <div class="position-relative flex-grow-1">
                                    <i
                                        class="bi bi-folder2-open position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
                                    <input type="text" id="filter-category-display"
                                        class="form-control fc-custom ps-5 cursor-pointer bg-white"
                                        placeholder="Tất cả danh mục" readonly
                                        onclick="openCategoryExplorer('filter', 'private')" style="cursor: pointer;">
                                    <input type="hidden" id="filter-category" value="">
                                </div>
                                <button type="button" class="btn btn-outline-danger p-2" id="clear-cat-btn"
                                    style="display: none; border-radius: 12px; height: 42px; width: 42px;"
                                    onclick="clearCategoryFilter()">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quizzes Grid -->
        <div class="quiz-grid" id="quizzesWrapper">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4"
                style="border-radius:20px; border:none; box-shadow:0 15px 40px rgba(0,0,0,0.15);">
                <div style="font-size:2.5rem; margin-bottom:10px;">🗑️</div>
                <h6 class="fw-bold mb-1">Xóa đề thi?</h6>
                <p class="text-muted small mb-3">Thao tác này không thể hoàn tác. Bạn có chắc chắn muốn xóa?</p>
                <input type="hidden" id="delQuizId">
                <div class="d-flex gap-2">
                    <button class="btn btn-light w-50 fw-bold" data-bs-dismiss="modal"
                        style="border-radius:12px; font-size:.85rem;">Hủy</button>
                    <button class="btn btn-danger w-50 fw-bold" onclick="confirmDelete()"
                        style="border-radius:12px; font-size:.85rem;">Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Assign Quiz Modal -->
    <div class="modal fade" id="assignModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="border-radius:20px; border:none; box-shadow:0 15px 40px rgba(0,0,0,0.15);">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold">Giao bài cho lớp học</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="assignForm">
                        <input type="hidden" id="assignQuizId" name="quizId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên đề thi</label>
                            <input type="text" id="assignQuizTitle" class="form-control rounded-3" readonly disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn lớp học</label>
                            <select id="classroomIdSelect" name="classroomId" class="form-select rounded-3" required>
                                <option value="" disabled selected>-- Chọn lớp học --</option>
                            </select>
                        </div>
                        <div class="mb-3" id="topicDropdownContainer" style="display: none;">
                            <label class="form-label fw-bold">Chọn chủ đề (Topic) - Không bắt buộc</label>
                            <select id="assignTopicId" name="topicId" class="form-select rounded-3">
                                <option value="" selected>-- Không chọn chủ đề --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Thời gian làm bài (Phút)</label>
                            <input type="number" name="durationInMins" class="form-control rounded-3" value="45" min="1"
                                required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Ngày mở đề</label>
                                <input type="text" id="assignStartDate" name="startDate"
                                    class="form-control rounded-3 flatpickr-datetime" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Hạn chót</label>
                                <input type="text" id="assignDueDate" name="dueDate"
                                    class="form-control rounded-3 flatpickr-datetime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số lần làm tối đa</label>
                            <input type="number" name="maxAttempt" class="form-control rounded-3" value="1" min="1"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ghi chú</label>
                            <textarea name="note" class="form-control rounded-3" rows="2"
                                placeholder="Ví dụ: Bài tập về nhà"></textarea>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="assignQShuffled"
                                name="questionShuffled">
                            <label class="form-check-label fw-bold" for="assignQShuffled">Xáo trộn câu hỏi</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="assignAShuffled" name="answerShuffled">
                            <label class="form-check-label fw-bold" for="assignAShuffled">Xáo trộn đáp án</label>
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="assignShowAnswer" name="showAnswer"
                                checked>
                            <label class="form-check-label fw-bold" for="assignShowAnswer">Cho phép học sinh xem đáp
                                án</label>
                        </div>
                        <button type="button" onclick="confirmAssign()" class="btn btn-primary w-100 py-2 fw-bold"
                            style="background:var(--blue); border:none; border-radius:10px;">Xác nhận giao đề</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-scripts('teacher')}"></div>
    <div id="toastWrap"></div>

    <div th:replace="~{layout/header :: changePasswordModal}"></div>
    <script th:replace="~{layout/header :: change-password-script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script>
        let allQuizzes = [];

        document.addEventListener('DOMContentLoaded', () => {

            loadQuizzes();
            if (typeof fetchCategories === 'function') fetchCategories();

            flatpickr('.flatpickr-datetime', {
                enableTime: true,
                altInput: true,
                altFormat: "d/m/Y H:i",
                dateFormat: "Y-m-dTH:i",
                time_24hr: true,
                locale: "vn",
                allowInput: true,
                minDate: "today"
            });
        });

        async function fetchCategories() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch('/api/teacher/categories/mine', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (res.ok) window.myCategories = await res.json();
            } catch (e) { console.error('Failed to load categories', e); }
        }

        async function loadQuizzes() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const wrapper = document.getElementById('quizzesWrapper');

            try {
                const res = await fetch('/api/teacher/quizzes/mine', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Lỗi tải danh sách đề thi');
                allQuizzes = await res.json();
                filterQuizzes();
            } catch (e) {
                wrapper.innerHTML = `
                    <div class="text-center py-5" style="grid-column:1/-1;">
                        <i class="bi bi-wifi-off text-muted d-block mb-3" style="font-size: 2.8rem;"></i>
                        <h5 class="text-muted fw-bold">Không thể tải đề thi</h5>
                        <p class="text-muted small">${e.message}</p>
                    </div>`;
            }
        }

        function filterQuizzes() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const categoryId = document.getElementById('filter-category').value;

            // Get all descendant category IDs for recursive filtering
            let targetCategoryIds = [];
            if (categoryId) {
                targetCategoryIds = [parseInt(categoryId)];
                const descendants = getDescendantIds(window.myCategories || [], parseInt(categoryId));
                targetCategoryIds = targetCategoryIds.concat(descendants);
            }

            const filtered = allQuizzes.filter(q => {
                const matchSearch = !search || (q.title && q.title.toLowerCase().includes(search));
                const matchCategory = !categoryId || targetCategoryIds.includes(q.categoryId);
                return matchSearch && matchCategory;
            });

            renderQuizzes(filtered);
        }

        // Helper to find all children IDs recursively
        function getDescendantIds(nodes, parentId) {
            let ids = [];
            for (const node of nodes) {
                if (node.id === parentId) {
                    collectChildIds(node.children || [], ids);
                    return ids;
                }
                if (node.children) {
                    const found = getDescendantIds(node.children, parentId);
                    if (found.length > 0) return found;
                }
            }
            return ids;
        }

        function collectChildIds(children, ids) {
            for (const child of children) {
                ids.push(child.id);
                if (child.children) collectChildIds(child.children, ids);
            }
        }

        function clearCategoryFilter() {
            document.getElementById('filter-category').value = '';
            document.getElementById('filter-category-display').value = 'Tất cả danh mục';
            document.getElementById('clear-cat-btn').style.display = 'none';
            filterQuizzes();
        }

        // Global callback for category selection
        window.triggerSearch = function () {
            const catId = document.getElementById('filter-category').value;
            document.getElementById('clear-cat-btn').style.display = catId ? 'inline-block' : 'none';
            filterQuizzes();
        };

        function renderQuizzes(list) {
            const wrapper = document.getElementById('quizzesWrapper');
            if (!list || list.length === 0) {
                wrapper.innerHTML = `
                    <div class="text-center py-5" style="grid-column: 1/-1;">
                        <i class="bi bi-file-earmark-x text-muted d-block mb-3" style="font-size: 3rem; color: #cbd5e1 !important;"></i>
                        <h5 style="color:#475569; font-weight:700;">Không tìm thấy đề thi nào</h5>
                        <p style="font-size:.85rem; color:#94a3b8; margin-bottom:0;">Vui lòng đổi bộ lọc hoặc soạn đề thi mới.</p>
                    </div>`;
                return;
            }

            wrapper.innerHTML = list.map(q => {
                const typeBadge = q.isExam
                    ? `<span class="qbadge qbadge-exam"><i class="bi bi-mortarboard-fill"></i> Kiểm tra</span>`
                    : `<span class="qbadge qbadge-quiz"><i class="bi bi-journal-check"></i> Luyện tập</span>`;

                return `
                <div class="quiz-card">
                    <div class="quiz-badge-row">${typeBadge}</div>
                    <h3 class="quiz-title">${esc(q.title) || '(Chưa có tiêu đề)'}</h3>
                    <p class="quiz-desc">${esc(q.description) || '<span style="color:#cbd5e1; font-style:italic;">Chưa có mô tả.</span>'}</p>
                    <div class="quiz-chips">
                        <span class="chip"><i class="bi bi-list-check text-success"></i> ${q.questionCount} câu</span>
                        <span class="chip"><i class="bi bi-folder text-primary"></i> ${esc(q.categoryName) || 'Kho chung'}</span>
                    </div>
                    <div class="quiz-actions">
                        <a class="qact qact-edit" href="/teacher/quizzes/${q.id}/edit"><i class="bi bi-pencil-square"></i> Sửa</a>
                        <a class="qact qact-view" href="/teacher/quizzes/${q.id}/preview"><i class="bi bi-eye"></i> Xem</a>
                        <button class="qact qact-assign" onclick="openAssignModal('${q.id}', '${esc(q.title)}')"><i class="bi bi-send-fill"></i> Giao bài</button>
                        <button class="qact qact-del" onclick="openDeleteModal('${q.id}')"><i class="bi bi-trash3"></i></button>
                    </div>
                </div>`;
            }).join('');
        }

        function openDeleteModal(id) {
            document.getElementById('delQuizId').value = id;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
        }

        async function confirmDelete() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const id = document.getElementById('delQuizId').value;

            try {
                const res = await fetch(`/api/teacher/quizzes/${id}`, {
                    method: 'DELETE',
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Lỗi khi xóa đề thi');
                bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                showToast('Đã xóa đề thi thành công!', 'ok');
                loadQuizzes();
            } catch (e) {
                showToast(e.message, 'err');
            }
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function showToast(msg, type = 'ok') {
            const wrap = document.getElementById('toastWrap');
            if (!wrap) return;

            const el = document.createElement('div');
            el.className = `toast-msg ${type}`;
            el.innerHTML = `<i class="bi ${type === 'ok' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'}"></i> <span>${msg}</span>`;

            wrap.appendChild(el);
            setTimeout(() => el.classList.add('show'), 10);
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('classroomIdSelect');
            if (select) {
                select.addEventListener('change', async function () {
                    const classId = this.value;
                    const topicContainer = document.getElementById('topicDropdownContainer');
                    const topicSelect = document.getElementById('assignTopicId');

                    topicSelect.innerHTML = '<option value="" selected>-- Không chọn chủ đề --</option>';
                    topicContainer.style.display = 'none';

                    if (!classId) return;

                    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                    try {
                        const res = await fetch('/api/teacher/class-topics/classroom/' + classId, {
                            headers: { Authorization: 'Bearer ' + token }
                        });
                        if (res.ok) {
                            const topics = await res.json();
                            if (topics && topics.length > 0) {
                                topics.forEach(t => {
                                    const opt = document.createElement('option');
                                    opt.value = t.id;
                                    opt.textContent = t.name;
                                    topicSelect.appendChild(opt);
                                });
                                topicContainer.style.display = 'block';
                            }
                        }
                    } catch (e) {
                        console.error('Lỗi khi tải danh sách chủ đề:', e);
                    }
                });
            }
        });

        async function openAssignModal(id, title) {
            document.getElementById('assignQuizId').value = id;
            document.getElementById('assignQuizTitle').value = title;

            document.getElementById('assignTopicId').innerHTML = '<option value="" selected>-- Không chọn chủ đề --</option>';
            document.getElementById('topicDropdownContainer').style.display = 'none';

            // Set default dates
            const now = new Date();
            const due = new Date();
            due.setDate(now.getDate() + 7);
            due.setHours(23, 59, 0, 0);

            // Update Flatpickr values
            const startPicker = document.querySelector("#assignStartDate")._flatpickr;
            const duePicker = document.querySelector("#assignDueDate")._flatpickr;
            if (startPicker) startPicker.setDate(now);
            if (duePicker) duePicker.setDate(due);

            // Fetch classrooms
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const select = document.getElementById('classroomIdSelect');
            select.innerHTML = '<option value="" disabled selected>-- Chọn lớp học --</option>';

            try {
                const res = await fetch('/api/teacher/classrooms', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (res.ok) {
                    const classrooms = await res.json();
                    classrooms.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = `${c.name} (${c.code})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
            }

            bootstrap.Modal.getOrCreateInstance(document.getElementById('assignModal')).show();
        }

        async function confirmAssign() {
            const form = document.getElementById('assignForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => {
                if (key === 'questionShuffled' || key === 'answerShuffled' || key === 'showAnswer') {
                    data[key] = true;
                } else {
                    data[key] = value;
                }
            });

            // Validation
            const start = new Date(data.startDate);
            const due = new Date(data.dueDate);
            const duration = parseInt(data.durationInMins);

            if (due <= start) {
                alert('Thời gian kết thúc phải sau thời gian bắt đầu!');
                return;
            }

            const windowMins = (due - start) / (1000 * 60);
            if (duration > windowMins) {
                alert(`Thời gian làm bài (${duration} phút) không được vượt quá khoảng thời gian mở đề (${Math.floor(windowMins)} phút)!`);
                return;
            }

            if (!data.questionShuffled) data.questionShuffled = false;
            if (!data.answerShuffled) data.answerShuffled = false;
            if (!data.showAnswer) data.showAnswer = false;

            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch('/api/teacher/quiz-assigning', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('assignModal')).hide();
                    showToast('Giao đề thi thành công!', 'ok');
                } else {
                    showToast('Đã có lỗi xảy ra. Hãy thử lại!', 'err');
                }
            } catch (err) {
                showToast('Lỗi kết nối. Vui lòng thử lại!', 'err');
            }
        }
    </script>
</body>

</html>
