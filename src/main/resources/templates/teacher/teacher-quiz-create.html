<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Đề Thi | QuizHub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            color: #334155;
            transition: all 0.3s ease;
        }

        /* Page fade-in effect */
        .page-fade {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 900;
            font-size: 1.75rem;
            color: #1e1b4b;
            margin: 0;
        }

        .page-sub {
            color: #64748b;
            font-size: .9rem;
            margin: 2px 0 0;
        }

        .card-panel {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .fc {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 11px 14px;
            font-size: 0.92rem;
            font-weight: 500;
            width: 100%;
            transition: border-color 0.2s;
        }

        .fc:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .question-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.22s;
            cursor: pointer;
            position: relative;
        }

        .question-card:hover {
            border-color: #a5b4fc;
            background: #fcfdff;
            box-shadow: 0 4px 15px rgba(67, 56, 202, 0.05);
            transform: translateY(-2px);
        }

        .question-card.selected {
            border-color: #4f46e5;
            background: #eff6ff;
            box-shadow: 0 4px 15px rgba(67, 56, 202, 0.08);
        }

        .qbadge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .qbadge-type {
            background: #e0e7ff;
            color: #4338ca;
        }

        .qbadge-level {
            background: #ede9fe;
            color: #7c3aed;
        }

        .right-scroller {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .right-scroller::-webkit-scrollbar {
            width: 5px;
        }

        .right-scroller::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .btn-submit-quiz {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit-quiz:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
        }

        #toastWrap {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast-msg {
            background: #1e1b4b;
            color: #fff;
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 9px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateX(16px);
            transition: all 0.3s ease;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-msg.ok i {
            color: #4ade80;
        }

        .toast-msg.err i {
            color: #fb7185;
        }

        .cursor-pointer {
            cursor: pointer !important;
        }

        .category-selectable-name {
            cursor: pointer;
            transition: color 0.15s;
        }

        .category-selectable-name:hover {
            color: #4338ca !important;
            text-decoration: underline;
        }

        .folder-toggle {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script>(function () { if (localStorage.getItem('sidebar-collapsed') === 'true') document.body.classList.add('sidebar-collapsed'); })()</script>
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('categories-mine')}"></aside>
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content" class="page-fade">
        <input type="hidden" id="quizIdInput" th:value="${quizId}">
        <input type="hidden" id="categoryIdInput" th:value="${categoryId}">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="page-title"><i class="bi bi-file-earmark-plus-fill me-2" style="color: #4338ca;"></i>Soạn Đề
                    Thi Mới</h1>
                <p class="page-sub">Tạo đề thi thủ công từ danh mục cá nhân hoặc kho câu hỏi công khai.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="/teacher/categories?type=mine" class="btn btn-light fw-bold"
                    style="border-radius:12px; padding:10px 24px; border: 1px solid #e2e8f0;"><i
                        class="bi bi-arrow-left"></i> Trở về</a>
                <button type="button" class="btn btn-outline-primary fw-bold" onclick="previewQuiz()"
                    style="border-radius:12px; padding:10px 24px;"><i class="bi bi-eye-fill me-1"></i> Xem trước</button>
                <button type="button" class="btn btn-submit-quiz" onclick="saveQuiz()"><i
                        class="bi bi-floppy-fill me-1"></i> Lưu Đề Thi</button>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left: Metadata Panel -->
            <div class="col-lg-5">
                <div class="card-panel">
                    <h5 class="fw-bold mb-3" style="color: #1e1b4b;"><i
                            class="bi bi-info-circle-fill me-1 text-primary"></i> 1. Thông tin Đề thi</h5>
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1" style="color:#475569;">Tiêu đề đề thi <span
                                class="text-danger">*</span></label>
                        <input type="text" id="quiz-title" class="fc"
                            placeholder="Ví dụ: Kiểm tra giữa kỳ môn Tiếng Anh" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1" style="color:#475569;">Mô tả (Ngắn gọn)</label>
                        <textarea id="quiz-desc" class="fc" rows="3" placeholder="Ví dụ: Ôn tập kiến thức..."
                            autocomplete="off"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1" style="color:#475569;">Danh mục Lưu Trữ <span
                                class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="text" id="quiz-category-display"
                                class="form-control fc cursor-pointer bg-white" placeholder="Chọn danh mục đề thi..."
                                readonly onclick="openCategoryTreePicker('quiz')" style="border-radius:12px 0 0 12px;">
                            <button type="button" class="btn btn-outline-secondary"
                                onclick="openCategoryTreePicker('quiz')" style="border-radius: 0 12px 12px 0;"><i
                                    class="bi bi-folder-fill"></i></button>
                        </div>
                        <input type="hidden" id="quiz-category">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1" style="color:#475569;">Ảnh đại diện đề thi
                            (URL)</label>
                        <input type="text" id="quiz-image" class="fc" placeholder="https://..." autocomplete="off">
                    </div>
                    <div class="row g-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold mb-1" style="color:#475569;">Trạng thái</label>
                            <select id="quiz-isDraft" class="form-select fc">
                                <option value="false" selected>Đã xuất bản (Published)</option>
                                <option value="true">Bản nháp (Draft)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold mb-1" style="color:#475569;">Loại bài tập</label>
                            <select id="quiz-isExam" class="form-select fc">
                                <option value="false" selected>Quiz luyện tập</option>
                                <option value="true">Đề thi (Exam)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Question Selection Panel -->
            <div class="col-lg-7">
                <div th:replace="~{fragments/quiz-editor :: question-selection-panel}"></div>
            </div>
        </div>
    </main>

    <!-- Popup tree picker for Category selection -->
    <div th:replace="~{fragments/category-explorer :: category-explorer-modal}"></div>
    <div th:replace="~{fragments/category-explorer :: category-explorer-private-modal}"></div>

    <!-- Modal for Previewing the Entire Quiz -->
    <div th:replace="~{fragments/quiz-preview :: quiz-preview-modal}"></div>





    <!-- Modal for Previewing a Question -->
    <div class="modal fade" id="previewQuestionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content"
                style="border-radius: 20px; border: none; box-shadow: 0 15px 40px rgba(0,0,0,0.18);">
                <div class="modal-header border-0 px-4 pt-4 bg-light">
                    <h5 class="modal-title fw-bold" style="color:#1e1b4b;"><i class="bi bi-eye-fill me-2"
                            style="color:#4338ca;"></i> Xem trước câu hỏi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3" style="max-height: 55vh; overflow-y: auto;">
                    <div id="preview-q-badges" class="mb-2 d-flex gap-2 flex-wrap"></div>
                    <div id="preview-q-text" class="fw-bold mb-3"
                        style="font-size: 1.1rem; color: #1e1b4b; line-height: 1.5;"></div>
                    <div id="preview-ans-wrapper"></div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal"
                        style="border-radius:12px; padding:10px 24px;">Đóng lại</button>
                    <button type="button" class="btn btn-outline-success fw-bold" onclick="editCurrentQuestionInPreview()"
                        style="border-radius:12px; padding:10px 24px;"><i class="bi bi-pencil-square me-1"></i> Sửa câu hỏi</button>
                    <button type="button" id="btn-modal-select-toggle" class="btn btn-submit-quiz"
                        onclick="toggleSelectionInModal()"><i class="bi bi-check-circle me-1"></i> Chọn câu hỏi vào
                        đề</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for inline Question editing directly in the Quiz screen -->
    <div class="modal fade" id="editQuestionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content"
                style="border-radius: 16px; border:none; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header bg-light border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold" id="editQuestionModalLabel" style="color: #1e1b4b;"><i
                            class="bi bi-pencil-square me-2" style="color: #4338ca;"></i> Chỉnh sửa câu hỏi & Đáp án
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3" style="max-height: 70vh; overflow-y: auto;">
                    <input type="hidden" id="edit-q-id">
                    <div class="mb-3">
                        <label class="form-label small fw-bold mb-1" style="color:#475569;">Nội dung câu hỏi <span
                                class="text-danger">*</span></label>
                        <textarea id="edit-q-text" class="fc" rows="3" required
                            placeholder="Nhập nội dung câu hỏi..."></textarea>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold mb-1" style="color:#475569;">Loại câu hỏi <span
                                    class="text-danger">*</span></label>
                            <select id="edit-q-type" class="form-select fc" required onchange="adaptAnswerInputs()">
                                <option value="SINGLE_CHOICE">Một đáp án</option>
                                <option value="MULTIPLE_CHOICE">Nhiều đáp án</option>
                                <option value="FILL_IN_BLANK">Điền khuyết</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold mb-1" style="color:#475569;">Mức độ khó <span
                                    class="text-danger">*</span></label>
                            <select id="edit-q-level" class="form-select fc" required>
                                <option value="EASY">Dễ</option>
                                <option value="MEDIUM" selected>Trung bình</option>
                                <option value="HARD">Khó</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Answers Editor -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-0" style="color: #1e1b4b;"><i class="bi bi-list-check me-1"
                                style="color: #4338ca;"></i> Chỉnh sửa danh sách đáp án</h6>
                        <button type="button" class="btn btn-sm btn-outline-primary fw-bold"
                            onclick="addNewAnswerInput()" id="btn-add-ans"
                            style="border-radius:10px; padding: 6px 14px;"><i class="bi bi-plus-circle"></i> Thêm đáp
                            án</button>
                    </div>

                    <div id="edit-ans-wrapper">
                        <!-- answers populated via JS -->
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal"
                        style="border-radius:12px; padding:10px 24px;">Hủy bỏ</button>
                    <button type="button" class="btn btn-submit-quiz" onclick="saveQuestionChanges()"><i
                            class="bi bi-check-circle me-1"></i> Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const quizId = document.getElementById('quizIdInput').value;
        const initialCategoryId = document.getElementById('categoryIdInput').value;

        let myCategories = [];
        let publicCategories = [];
        let questionsList = [];
        let selectedQuestionIds = new Set();
        let editModal = null;
        let previewModal = null;
        let catPickerModal = null;
        let previewingQuestionId = null;
        let categorySelectTarget = 'quiz'; // 'quiz' | 'filter' | 'question'

        document.addEventListener('DOMContentLoaded', async () => {
            editModal = new bootstrap.Modal(document.getElementById('editQuestionModal'));
            previewModal = new bootstrap.Modal(document.getElementById('previewQuestionModal'));
            catPickerModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('categoryExplorerModal'));

            const toggleBtn = document.querySelector('.toggle-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', e => {
                    e.preventDefault();
                    document.body.classList.toggle('sidebar-collapsed');
                    localStorage.setItem('sidebar-collapsed', document.body.classList.contains('sidebar-collapsed'));
                });
            }

            await fetchCategories();
            if (quizId) {
                await fetchQuizToEdit();
            } else {
                if (initialCategoryId) {
                    const matchedCat = findCategoryById(myCategories, parseInt(initialCategoryId));
                    if (matchedCat) {
                        document.getElementById('quiz-category').value = matchedCat.id;
                        document.getElementById('quiz-category-display').value = matchedCat.name;
                    }
                }
                await loadQuestions();
            }
        });

        async function fetchCategories() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch('/api/teacher/categories/mine', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    myCategories = await res.json();
                }

                const pubRes = await fetch('/api/teacher/categories/public', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (pubRes.ok) {
                    publicCategories = await pubRes.json();
                }
            } catch (err) {
                console.error('Lỗi tải danh mục', err);
            }
        }

        function findCategoryById(nodes, id) {
            for (let n of nodes) {
                if (n.id === id) return n;
                if (n.children && n.children.length > 0) {
                    const child = findCategoryById(n.children, id);
                    if (child) return child;
                }
            }
            return null;
        }

        function openCategoryTreePicker(target = 'quiz') {
            categorySelectTarget = target;

            if (target === 'quiz' || target === 'question') {
                const privateContainer = document.getElementById('private-category-tree-container');
                if (privateContainer) {
                    privateContainer.innerHTML = renderTreeNodes(myCategories, 'mine');
                    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('categoryExplorerPrivateModal'));
                    modal.show();
                }
            } else {
                const myContainer = document.getElementById('my-category-tree-container');
                const publicContainer = document.getElementById('public-category-tree-container');
                if (myContainer) myContainer.innerHTML = renderTreeNodes(myCategories, 'mine');
                if (publicContainer) publicContainer.innerHTML = renderTreeNodes(publicCategories, 'public');
                const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('categoryExplorerModal'));
                modal.show();
            }
        }

        function renderTreeNodes(nodes, source) {
            if (!nodes || nodes.length === 0) return '';
            return `<ul class="list-unstyled ps-3 mt-1">
                ${nodes.map(n => `
                    <li class="mb-2">
                        <span class="category-selectable-name text-dark fw-semibold small" onclick="selectCategoryFromTree(${n.id}, '${esc(n.name)}', '${source}')">
                            <i class="bi bi-folder-fill text-warning me-1"></i> ${esc(n.name)}
                        </span>
                        ${n.children ? renderTreeNodes(n.children, source) : ''}
                    </li>
                `).join('')}
            </ul>`;
        }

        function selectCategoryFromTree(id, name, source) {
            if (categorySelectTarget === 'quiz') {
                document.getElementById('quiz-category').value = id;
                document.getElementById('quiz-category-display').value = name;
            } else if (categorySelectTarget === 'filter') {
                document.getElementById('q-category-filter').value = id;
                document.getElementById('q-category-filter-display').value = name;
                document.getElementById('q-source').value = source; // Auto set source
                loadQuestions();
            } else if (categorySelectTarget === 'question') {
                document.getElementById('edit-q-category').value = id;
                document.getElementById('edit-q-category-display').value = name;
            }
            bootstrap.Modal.getInstance(document.getElementById(categorySelectTarget === 'quiz' || categorySelectTarget === 'question' ? 'categoryExplorerPrivateModal' : 'categoryExplorerModal')).hide();
        }

        function clearCategoryFilterSelection() {
            document.getElementById('q-category-filter').value = '';
            document.getElementById('q-category-filter-display').value = 'Tất cả danh mục';
            loadQuestions();
        }

        function previewQuiz() {
            const title = document.getElementById('quiz-title').value.trim();
            const desc = document.getElementById('quiz-desc').value.trim();
            
            document.getElementById('preview-quiz-title').textContent = title || 'Chưa có tiêu đề';
            document.getElementById('preview-quiz-desc').textContent = desc || 'Chưa có mô tả.';

            const container = document.getElementById('preview-quiz-questions');
            container.innerHTML = '';

            const selectedList = questionsList.filter(q => selectedQuestionIds.has(q.id));

            document.getElementById('preview-quiz-count').textContent = selectedList.length;

            if (selectedList.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-4">Chưa có câu hỏi nào được chọn vào đề.</div>`;
            } else {
                container.innerHTML = selectedList.map((q, idx) => {
                    let ansHtml = '';
                    if (q.answers && q.answers.length > 0) {
                        ansHtml = q.answers.map((a, i) => `
                            <div class="p-2 border rounded mb-2 d-flex align-items-center justify-content-between ${a.isCorrect ? 'bg-success bg-opacity-10 text-success fw-bold' : 'bg-light text-muted'}" style="border-radius:10px; font-size:0.95rem; border:1px solid #e2e8f0 !important;">
                                <span>${String.fromCharCode(65 + i)}. ${esc(a.text || a.answerText || '')}</span>
                                ${a.isCorrect ? '<i class="bi bi-check-circle-fill ms-2 text-success"></i>' : ''}
                            </div>`).join('');
                    } else {
                        ansHtml = `<p class="text-muted small">Không có đáp án.</p>`;
                    }

                    return `<div class="p-3 border rounded-3 bg-white mb-3" style="border-color:#e2e8f0;">
                        <div class="fw-bold mb-2" style="color: #1e1b4b;">Câu ${idx + 1}: ${esc(q.text || q.questionText || '')}</div>
                        <div>${ansHtml}</div>
                    </div>`;
                }).join('');
            }

            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('previewQuizModal'));
            modal.show();
        }

        async function fetchQuizToEdit() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch(`/api/teacher/quizzes/${quizId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.ok) {
                    const q = await res.json();
                    document.getElementById('quiz-title').value = q.title || '';
                    document.getElementById('quiz-desc').value = q.description || '';
                    document.getElementById('quiz-image').value = q.imageUrl || '';
                    document.getElementById('quiz-isDraft').value = String(q.isDraft);
                    document.getElementById('quiz-isExam').value = String(q.isExam);

                    if (q.category) {
                        document.getElementById('quiz-category').value = q.category.id;
                        document.getElementById('quiz-category-display').value = q.category.name;
                    }

                    if (q.questionIds) {
                        q.questionIds.forEach(id => selectedQuestionIds.add(id));
                    } else if (q.questions) {
                        q.questions.forEach(qi => selectedQuestionIds.add(qi.id));
                    }
                    updateSelectedCount();
                    await loadQuestions();
                }
            } catch (err) {
                showToast('Không thể tải thông tin đề thi để sửa', 'err');
            }
        }

        async function loadQuestions() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const search = document.getElementById('q-search').value;
            const type = document.getElementById('q-type').value;
            const source = document.getElementById('q-source').value;
            const categoryId = document.getElementById('q-category-filter').value;

            const url = `/api/teacher/questions?keyword=${encodeURIComponent(search)}&type=${type}&isPublicTab=${source === 'public'}${categoryId ? '&categoryId=' + categoryId : ''}&page=0&size=150`;

            const wrapper = document.getElementById('questions-wrapper');
            wrapper.innerHTML = `<div class="text-center py-4"><span class="spinner-border text-indigo" style="color:#4338ca;"></span><p class="text-muted mt-2">Đang tìm kiếm câu hỏi...</p></div>`;

            try {
                const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    questionsList = data.content || [];
                    filterLocalQuestions();
                }
            } catch (err) {
                showToast('Lỗi tải danh sách câu hỏi!', 'err');
            }
        }

        function filterLocalQuestions() {
            const level = document.getElementById('q-level').value;
            const filtered = questionsList.filter(q => {
                if (level && q.level !== level) return false;
                return true;
            });
            renderQuestions(filtered);
        }

        function renderQuestions(list) {
            const wrapper = document.getElementById('questions-wrapper');
            if (list.length === 0) {
                wrapper.innerHTML = `<p class="text-muted py-4 text-center">Không tìm thấy câu hỏi phù hợp.</p>`;
                return;
            }

            wrapper.innerHTML = list.map(q => {
                const isSelected = selectedQuestionIds.has(q.id);
                let typeLabel = q.type === 'SINGLE_CHOICE' ? '1 đáp án' : (q.type === 'MULTIPLE_CHOICE' ? 'Nhiều đáp án' : 'Điền khuyết');
                let levelLabel = q.level === 'EASY' ? 'Dễ' : (q.level === 'MEDIUM' ? 'Trung bình' : 'Khó');

                return `<div class="question-card ${isSelected ? 'selected' : ''}" onclick="toggleQuestionSelection(${q.id}, event)">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="flex-shrink-0">
                                <input type="checkbox" class="form-check-input" style="width:26px; height:26px; accent-color:#4f46e5; border-radius:6px; cursor:pointer; pointer-events: none;" ${isSelected ? 'checked' : ''}>
                            </div>
                            <div>
                                <div class="d-flex gap-2 mb-1">
                                    <span class="qbadge qbadge-type"><i class="bi bi-patch-check"></i> ${typeLabel}</span>
                                    <span class="qbadge qbadge-level"><i class="bi bi-graph-up"></i> ${levelLabel}</span>
                                </div>
                                <div class="fw-bold text-dark" style="font-size: 0.95rem;">${esc(q.text)}</div>
                            </div>
                        </div>
                        <div>
                            <button type="button" class="btn btn-sm btn-outline-secondary px-3" onclick="openPreviewModal(${q.id}, event)" style="border-radius:10px; font-size:0.82rem; white-space:nowrap;">
                                <i class="bi bi-eye"></i> Xem
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function openPreviewModal(qId, event) {
            if (event) event.stopPropagation();
            const q = questionsList.find(item => item.id === qId);
            if (!q) return;

            previewingQuestionId = qId;
            let typeLabel = q.type === 'SINGLE_CHOICE' ? '1 đáp án' : (q.type === 'MULTIPLE_CHOICE' ? 'Nhiều đáp án' : 'Điền khuyết');
            let levelLabel = q.level === 'EASY' ? 'Dễ' : (q.level === 'MEDIUM' ? 'Trung bình' : 'Khó');

            document.getElementById('preview-q-badges').innerHTML = `
                <span class="qbadge qbadge-type"><i class="bi bi-patch-check"></i> ${typeLabel}</span>
                <span class="qbadge qbadge-level"><i class="bi bi-graph-up"></i> ${levelLabel}</span>
            `;
            document.getElementById('preview-q-text').textContent = q.text || '';

            let wrap = document.getElementById('preview-ans-wrapper');
            if (q.answers && q.answers.length > 0) {
                wrap.innerHTML = q.answers.map((a, idx) => `
                    <div class="p-3 border rounded mb-2 ${a.isCorrect ? 'bg-success bg-opacity-10 text-success fw-bold' : 'bg-light text-muted'}" style="border-radius:12px; font-size:0.95rem; border:1px solid #e2e8f0 !important;">
                        <div class="d-flex align-items-center justify-content-between">
                            <span>${String.fromCharCode(65 + idx)}. ${esc(a.text)}</span>
                            ${a.isCorrect ? '<i class="bi bi-check-circle-fill ms-2"></i>' : ''}
                        </div>
                    </div>`).join('');
            } else {
                wrap.innerHTML = `<p class="text-muted small">Không có đáp án.</p>`;
            }

            const isSelected = selectedQuestionIds.has(qId);
            const btn = document.getElementById('btn-modal-select-toggle');
            if (isSelected) {
                btn.className = "btn btn-danger fw-bold";
                btn.innerHTML = `<i class="bi bi-dash-circle me-1"></i> Bỏ chọn câu hỏi`;
            } else {
                btn.className = "btn btn-submit-quiz fw-bold";
                btn.innerHTML = `<i class="bi bi-check-circle me-1"></i> Chọn câu hỏi vào đề`;
            }

            previewModal.show();
        }

        function editCurrentQuestionInPreview() {
            if (previewingQuestionId) {
                previewModal.hide();
                openEditQuestionModal(previewingQuestionId);
            }
        }

        function toggleSelectionInModal() {
            if (previewingQuestionId) {
                if (selectedQuestionIds.has(previewingQuestionId)) {
                    selectedQuestionIds.delete(previewingQuestionId);
                } else {
                    selectedQuestionIds.add(previewingQuestionId);
                }
                updateSelectedCount();
                renderQuestions(questionsList);
                previewModal.hide();
            }
        }

        function toggleQuestionSelection(id, event) {
            if (event) event.stopPropagation();
            if (selectedQuestionIds.has(id)) {
                selectedQuestionIds.delete(id);
            } else {
                selectedQuestionIds.add(id);
            }
            updateSelectedCount();
            renderQuestions(questionsList);
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = `Đã chọn ${selectedQuestionIds.size} câu hỏi`;
        }

        // Inline Question Modal Editing Logic
        let editingQuestion = null;

        function openEditQuestionModal(qId) {
            editingQuestion = questionsList.find(q => q.id === qId);
            if (!editingQuestion) return;

            document.getElementById('edit-q-id').value = editingQuestion.id;
            document.getElementById('edit-q-text').value = editingQuestion.text || '';
            document.getElementById('edit-q-type').value = editingQuestion.type || 'SINGLE_CHOICE';
            document.getElementById('edit-q-level').value = editingQuestion.level || 'MEDIUM';

            adaptAnswerInputs();
            editModal.show();
        }

        function adaptAnswerInputs() {
            const type = document.getElementById('edit-q-type').value;
            const wrap = document.getElementById('edit-ans-wrapper');
            const btnAdd = document.getElementById('btn-add-ans');

            // FILL_IN_BLANK doesn't use multiple answers dynamically as standard choices.
            if (type === 'FILL_IN_BLANK') {
                btnAdd.style.display = 'none';
                wrap.innerHTML = `<div class="mb-2"><label class="small text-muted fw-bold mb-1">Đáp án đúng cho câu điền khuyết:</label>
                    <input type="text" class="fc edit-ans-text" placeholder="Nhập đáp án đúng..." required value="${editingQuestion && editingQuestion.answers && editingQuestion.answers[0] ? esc(editingQuestion.answers[0].text) : ''}">
                </div>`;
            } else {
                btnAdd.style.display = 'inline-block';
                if (editingQuestion && editingQuestion.answers && editingQuestion.answers.length > 0) {
                    wrap.innerHTML = editingQuestion.answers.map((a, idx) => `
                        <div class="d-flex align-items-center gap-2 mb-2 edit-ans-row">
                            <input type="${type === 'SINGLE_CHOICE' ? 'radio' : 'checkbox'}" name="editAnsCorrect" class="form-check-input flex-shrink-0" style="width:20px;height:20px;" ${a.isCorrect ? 'checked' : ''}>
                            <input type="text" class="fc edit-ans-text flex-grow-1" required value="${esc(a.text)}" placeholder="Nội dung câu trả lời">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()" style="border-radius:8px;"><i class="bi bi-trash"></i></button>
                        </div>
                    `).join('');
                } else {
                    wrap.innerHTML = '';
                    for (let i = 0; i < 4; i++) addNewAnswerInput();
                }
            }
        }

        function addNewAnswerInput() {
            const type = document.getElementById('edit-q-type').value;
            const wrap = document.getElementById('edit-ans-wrapper');
            const el = document.createElement('div');
            el.className = 'd-flex align-items-center gap-2 mb-2 edit-ans-row';
            el.innerHTML = `
                <input type="${type === 'SINGLE_CHOICE' ? 'radio' : 'checkbox'}" name="editAnsCorrect" class="form-check-input flex-shrink-0" style="width:20px;height:20px;">
                <input type="text" class="fc edit-ans-text flex-grow-1" required placeholder="Nội dung câu trả lời">
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()" style="border-radius:8px;"><i class="bi bi-trash"></i></button>
            `;
            wrap.appendChild(el);
        }

        async function saveQuestionChanges() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const id = document.getElementById('edit-q-id').value;
            const text = document.getElementById('edit-q-text').value.trim();
            const type = document.getElementById('edit-q-type').value;
            const level = document.getElementById('edit-q-level').value;

            if (!text) { showToast('Vui lòng nhập nội dung câu hỏi!', 'err'); return; }

            let answers = [];
            if (type === 'FILL_IN_BLANK') {
                const ansText = document.querySelector('.edit-ans-text').value.trim();
                if (!ansText) { showToast('Vui lòng nhập đáp án chính xác!', 'err'); return; }
                answers.push({ text: ansText, isCorrect: true });
            } else {
                const rows = document.querySelectorAll('.edit-ans-row');
                let hasCorrect = false;
                rows.forEach(r => {
                    const ansText = r.querySelector('.edit-ans-text').value.trim();
                    const isCorr = r.querySelector('input[name="editAnsCorrect"]').checked;
                    if (ansText) {
                        if (isCorr) hasCorrect = true;
                        answers.push({ text: ansText, isCorrect: isCorr });
                    }
                });

                if (answers.length < 2) { showToast('Vui lòng nhập ít nhất 2 câu trả lời!', 'err'); return; }
                if (!hasCorrect) { showToast('Phải có ít nhất 1 câu trả lời đúng!', 'err'); return; }
            }

            // Check for any modifications
            let changed = false;
            if (editingQuestion) {
                if (text !== editingQuestion.text) changed = true;
                if (type !== editingQuestion.type) changed = true;
                if (level !== editingQuestion.level) changed = true;

                if (editingQuestion.answers && editingQuestion.answers.length === answers.length) {
                    for (let i = 0; i < answers.length; i++) {
                        if (answers[i].text !== editingQuestion.answers[i].text ||
                            answers[i].isCorrect !== editingQuestion.answers[i].isCorrect) {
                            changed = true;
                            break;
                        }
                    }
                } else {
                    changed = true;
                }
            } else {
                changed = true;
            }

            if (!changed) {
                showToast('Không có thay đổi nào được thực hiện.', 'ok');
                editModal.hide();
                return;
            }

            let payload = {
                text,
                type,
                level,
                answers
            };
            const quizCatId = document.getElementById('quiz-category').value;
            const originalCatId = editingQuestion && editingQuestion.category ? editingQuestion.category.id : null;
            const finalCatId = originalCatId || quizCatId;
            if (finalCatId) {
                payload.categoryId = parseInt(finalCatId);
            }

            try {
                const res = await fetch(`/api/teacher/questions`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const newQuestion = await res.json();
                    showToast('Đã tạo một câu hỏi mới cho đề thi này!', 'ok');

                    selectedQuestionIds.delete(parseInt(id));
                    selectedQuestionIds.add(newQuestion.id);
                    updateSelectedCount();

                    editModal.hide();
                    await loadQuestions();
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Lỗi khi lưu thay đổi câu hỏi!', 'err');
                }
            } catch (err) {
                showToast('Có lỗi xảy ra khi lưu câu hỏi', 'err');
            }
        }

        async function saveQuiz() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const title = document.getElementById('quiz-title').value.trim();
            const description = document.getElementById('quiz-desc').value.trim();
            const imageUrl = document.getElementById('quiz-image').value.trim();
            const categoryId = document.getElementById('quiz-category').value;
            const isDraft = document.getElementById('quiz-isDraft').value === 'true';
            const isExam = document.getElementById('quiz-isExam').value === 'true';

            if (!title) { showToast('Vui lòng nhập tiêu đề đề thi!', 'err'); return; }
            if (!categoryId) { showToast('Vui lòng chọn danh mục đề thi!', 'err'); return; }
            if (selectedQuestionIds.size === 0) { showToast('Hãy chọn ít nhất 1 câu hỏi để tạo đề thi!', 'err'); return; }

            const payload = {
                title,
                description,
                imageUrl,
                categoryId: parseInt(categoryId),
                isDraft,
                isExam,
                questionIds: Array.from(selectedQuestionIds)
            };

            const url = quizId ? `/api/teacher/quizzes/${quizId}` : '/api/teacher/quizzes';
            const method = quizId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    showToast(quizId ? 'Cập nhật đề thi thành công!' : 'Tạo đề thi mới thành công!', 'ok');
                    setTimeout(() => window.location.href = '/teacher/categories?type=mine', 1000);
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Lỗi khi lưu đề thi', 'err');
                }
            } catch (err) {
                showToast('Có lỗi xảy ra khi lưu đề thi', 'err');
            }
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        function showToast(msg, type = 'ok') {
            const w = document.getElementById('toastWrap');
            const t = document.createElement('div');
            t.className = `toast-msg ${type}`;
            t.innerHTML = `<i class="bi ${type === 'ok' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'}"></i> ${msg}`;
            w.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
        }

        // JS functions for On the fly question creation
        let flyAnsCounter = 0;
        function toggleFlyAnswersUI() {
            const type = document.getElementById('fly-type').value;
            const checks = document.querySelectorAll('.fly-ans-correct');
            checks.forEach(chk => {
                chk.type = type === 'SINGLE_CHOICE' ? 'radio' : 'checkbox';
            });
        }
        function toggleFlyAnswersUI() {
            const type = document.getElementById('fly-type').value;
            const checks = document.querySelectorAll('.fly-ans-correct');
            const wrapper = document.getElementById('fly-answers-wrapper');

            if (type === 'FILL_IN_BLANK') {
                if (wrapper.querySelectorAll('.fly-ans-row').length > 1) {
                    wrapper.innerHTML = '';
                    addFlyAnswerRow('', true);
                }
                document.querySelectorAll('.fly-ans-correct').forEach(el => el.style.display = 'none');
            } else {
                document.querySelectorAll('.fly-ans-correct').forEach(el => el.style.display = 'block');
                checks.forEach(chk => {
                    chk.type = type === 'SINGLE_CHOICE' ? 'radio' : 'checkbox';
                });
            }
        }
        function addFlyAnswerRow(text = '', isCorrect = false) {
            const wrapper = document.getElementById('fly-answers-wrapper');
            const type = document.getElementById('fly-type').value;
            const idx = flyAnsCounter++;
            const row = document.createElement('div');
            row.className = 'd-flex align-items-center gap-2 mb-2 fly-ans-row';
            row.innerHTML = `
                <input class="form-check-input fly-ans-correct" type="${type === 'SINGLE_CHOICE' ? 'radio' : 'checkbox'}" 
                    name="flyAnsCorrect" ${isCorrect ? 'checked' : ''} 
                    style="width:22px; height:22px; cursor:pointer; ${type === 'FILL_IN_BLANK' ? 'display:none;' : ''}" 
                    title="Đánh dấu đáp án đúng">
                <input type="text" class="form-control rounded-3 fly-ans-text" value="${text}" 
                    placeholder="${type === 'FILL_IN_BLANK' ? 'Nhập đáp án đúng...' : 'Nội dung đáp án...'}" required autocomplete="off">
                <button type="button" class="btn btn-sm btn-outline-danger p-2 border-0" onclick="this.parentElement.remove()" style="border-radius:10px;"><i class="bi bi-trash"></i></button>
            `;
            wrapper.appendChild(row);
        }

        document.getElementById('createOnTheFlyQuestionModal').addEventListener('show.bs.modal', () => {
            const wrapper = document.getElementById('fly-answers-wrapper');
            wrapper.innerHTML = '';
            flyAnsCounter = 0;
            // Add 4 rows default
            addFlyAnswerRow('', true);
            addFlyAnswerRow('', false);
            addFlyAnswerRow('', false);
            addFlyAnswerRow('', false);
        });

        async function saveFlyQuestion() {
            const text = document.getElementById('fly-text').value.trim();
            const type = document.getElementById('fly-type').value;
            const level = document.getElementById('fly-level').value;
            const categoryId = document.getElementById('quiz-category').value || document.getElementById('categoryIdInput').value;

            if (!text) { showToast('Vui lòng nhập nội dung câu hỏi!', 'err'); return; }
            if (!categoryId) { showToast('Vui lòng chọn danh mục cho đề thi trước!', 'err'); return; }

            const answerRows = document.querySelectorAll('.fly-ans-row');
            if (type !== 'FILL_IN_BLANK' && answerRows.length < 2) { 
                showToast('Hãy thêm ít nhất 2 đáp án!', 'err'); return; 
            }
            if (type === 'FILL_IN_BLANK' && answerRows.length < 1) {
                showToast('Hãy nhập ít nhất 1 đáp án đúng!', 'err'); return;
            }

            const answers = [];
            let hasCorrect = false;
            answerRows.forEach(row => {
                const aText = row.querySelector('.fly-ans-text').value.trim();
                const aCorrect = type === 'FILL_IN_BLANK' ? true : row.querySelector('.fly-ans-correct').checked;
                if (aText) {
                    answers.push({ text: aText, isCorrect: aCorrect });
                    if (aCorrect) hasCorrect = true;
                }
            });

            if (type !== 'FILL_IN_BLANK' && answers.length < 2) { showToast('Hãy nhập nội dung cho ít nhất 2 đáp án!', 'err'); return; }
            if (type !== 'FILL_IN_BLANK' && !hasCorrect) { showToast('Hãy đánh dấu ít nhất 1 đáp án đúng!', 'err'); return; }
            if (type === 'FILL_IN_BLANK' && answers.length < 1) { showToast('Hãy nhập ít nhất 1 đáp án đúng!', 'err'); return; }

            const payload = {
                categoryId: parseInt(categoryId),
                text,
                type,
                level,
                answers
            };

            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const res = await fetch('/api/teacher/questions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const newQ = await res.json();
                    showToast('Đã lưu câu hỏi trực tiếp thành công!', 'ok');
                    bootstrap.Modal.getOrCreateInstance(document.getElementById('createOnTheFlyQuestionModal')).hide();
                    document.getElementById('fly-text').value = '';

                    // Insert the new question into our questionsList and auto-select it
                    questionsList.unshift(newQ);
                    selectedQuestionIds.add(newQ.id);
                    updateSelectedCount();
                    renderQuestions();
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Lỗi khi lưu câu hỏi', 'err');
                }
            } catch (err) {
                showToast('Không thể lưu câu hỏi!', 'err');
            }
        }
    </script>

    <!-- Modal: Tạo câu hỏi thủ công trực tiếp -->

                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 px-4 pb-4 gap-2">

                    <button type="button" onclick="saveFlyQuestion()" class="btn btn-primary fw-bold" style="border-radius:12px; padding:10px 24px; background:linear-gradient(135deg, #4f46e5, #7c3aed); border:none;">Lưu câu hỏi</button>
